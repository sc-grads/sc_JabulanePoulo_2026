name: Test SSIS Package

on:
  push:
    branches: [develop]
    paths:
      - 'SSIS/**'
      
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Build SSIS Project
        run: |
          msbuild SSIS\TimesheetMigration\TimesheetMigration.dtproj `
            /p:Configuration=Release `
            /p:OutputPath=.\bin\
      
      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "master" \
            -i Database/deploy.sql \
            -C