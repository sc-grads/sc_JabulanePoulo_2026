name: Deploy to Partner SQL Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'partner'
        type: choice
        options:
          - partner
          - production

jobs:
  deploy-partner:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment_name: partner-deployment
      database_name: Cloud-tunnel-JP
      deployment_type: Partner SQL Server
    secrets:
      teams_webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
