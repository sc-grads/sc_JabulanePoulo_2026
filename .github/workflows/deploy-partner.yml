name: Deploy to Partner SQL Server

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'partner'
        type: choice
        options:
          - partner
          - production

# Cancel running workflow on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Request approval via Teams
  request-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Send approval request to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " PARTNER DEPLOYMENT APPROVAL REQUIRED",
            "text": "**A database deployment to PARTNER SQL Server requires your approval**\n\n**Trigger:** ${{ github.event_name == 'push' && 'Auto (Push)' || 'Manual' }}\n**Environment:** Partner SQL Server\n**Database:** Cloud-tunnel-JP\n**Requested by:** ${{ github.actor }}\n**Branch:** ${{ github.ref_name }}\n**Commit:** ${{ github.sha }}\n**Time:** ${{ github.run_started_at }}\n\n** This will deploy to your PARTNER'\''s database!**\n\n**To approve this deployment:**\n1. Go to GitHub Actions\n2. Click \"Review deployments\"\n3. Select \"Approve\"\n\n[Click here to review](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FF0000",
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "Review in GitHub",
                "targets": [
                  {
                    "os": "default",
                    "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
      
      - name: Wait for approval message
        run: |
          echo "========================================="
          echo " PARTNER DEPLOYMENT APPROVAL REQUEST SENT"
          echo "========================================="
          echo ""
          echo " WARNING: This will deploy to PARTNER'S DATABASE"
          echo ""
          echo "Triggered by: ${{ github.event_name == 'push' && 'Git Push' : 'Manual Trigger' }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Waiting for reviewer to approve in GitHub..."
          echo "The workflow is PAUSED until approval is given."
          echo ""
          echo "Once approved, the deployment will continue."
          echo "========================================="
          
          # Create an artifact with workflow info for audit
          mkdir -p workflow-info
          echo "Trigger: ${{ github.event_name }}" > workflow-info/trigger.txt
          echo "Branch: ${{ github.ref_name }}" >> workflow-info/trigger.txt
          echo "Commit: ${{ github.sha }}" >> workflow-info/trigger.txt
          echo "Requested by: ${{ github.actor }}" >> workflow-info/trigger.txt
          echo "Time: ${{ github.run_started_at }}" >> workflow-info/trigger.txt

  # Job 2: Deploy to Partner with environment approval gate
  deploy-partner:
    needs: request-approval
    runs-on: ubuntu-latest
    environment: partner-deployment  # Creates approval gate for partner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Send deployment started notification to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " Partner Deployment Started (Approved)",
            "text": "**Trigger:** ${{ github.event_name == 'push' && 'Auto (Push)' : 'Manual' }}\n**Environment:** Partner SQL Server\n**Database:** Cloud-tunnel-JP\n**Approved by:** ${{ github.actor }}\n**Branch:** ${{ github.ref_name }}\n**Commit:** ${{ github.sha }}\n**Time:** ${{ github.run_started_at }}\n\n[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FFA500"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
      
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
      
      - name: Debug - Verify Partner Secrets
        run: |
          if [[ -n "${{ secrets.PARTNER_SQL_SERVER }}" ]]; then
            echo " PARTNER_SQL_SERVER secret is configured"
          else
            echo " PARTNER_SQL_SERVER secret is MISSING"
            exit 1
          fi
          
          if [[ -n "${{ secrets.PARTNER_SQL_USERNAME }}" ]]; then
            echo " PARTNER_SQL_USERNAME secret is configured"
          else
            echo " PARTNER_SQL_USERNAME secret is MISSING"
            exit 1
          fi
          
          if [[ -n "${{ secrets.PARTNER_SQL_PASSWORD }}" ]]; then
            echo " PARTNER_SQL_PASSWORD secret is configured"
          else
            echo " PARTNER_SQL_PASSWORD secret is MISSING"
            exit 1
          fi
          
          echo ""
          echo "Deployment will execute on partner's SQL Server"
      
      - name: Execute SQL Script on Partner Database
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "========================================="
          echo " Deploying to PARTNER SQL Server"
          echo "========================================="
          echo "Server: ${SERVER:0:30}..."
          echo "Database: Cloud-tunnel-JP"
          echo "========================================="
          
          /opt/mssql-tools18/bin/sqlcmd \
          -S "$SERVER" \
          -U "$USERNAME" \
          -P "$PASSWORD" \
          -d "master" \
          -i Database/deploy.sql \
          -C
      
      - name: Send success notification to Teams
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " Partner Deployment Successful!",
            "text": "**Trigger:** ${{ github.event_name == 'push' && 'Auto (Push)' : 'Manual' }}\n**Environment:** Partner SQL Server\n**Database:** Cloud-tunnel-JP\n**Status:**  Success\n**Branch:** ${{ github.ref_name }}\n**Completed:** $(date)\n\n[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "00FF00"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
      
      - name: Send failure notification to Teams
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " Partner Deployment Failed!",
            "text": "**Trigger:** ${{ github.event_name == 'push' && 'Auto (Push)' : 'Manual' }}\n**Environment:** Partner SQL Server\n**Database:** Cloud-tunnel-JP\n**Status:**  Failed\n**Branch:** ${{ github.ref_name }}\n**Time:** $(date)\n\n**Check logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n**Action required:** Review the error and fix the deployment script.",
            "themeColor": "FF0000"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
