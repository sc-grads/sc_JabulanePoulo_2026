name: Deploy Local & Partner SQL
 
on:
  push:
    branches:
      - main
 
  workflow_dispatch:
 
jobs:
 
  DevTest:
    uses: ./.github/workflows/reusable-sql-deploy.yml
    with:
      environment-name: local-sql
    secrets: inherit
 
  request-approval-partner:
    needs: DevTest
    runs-on: ubuntu-latest
    environment: partner-sql 
 
    steps:
      - name: Send Approval Required notification to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " PARTNER SQL DEPLOYMENT APPROVAL REQUIRED",
            "text": "**A production deployment is waiting for your approval**\n\n",
            "facts": [
              {
                "name": " Environment",
                "value": "Partner SQL (Production)"
              },
              {
                "name": " Requested by",
                "value": "${{ github.actor }}"
              },
              {
                "name": " Branch",
                "value": "${{ github.ref_name }}"
              },
              {
                "name": " Run ID",
                "value": "${{ github.run_id }}"
              },
              {
                "name": " DevTest Status",
                "value": "Completed Successfully"
              }
            ],
            "potentialAction": "[Approve Deployment](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FFA500"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
 
      - name: Waiting for partner approval
        run: echo "⏳ Waiting for partner-sql approval..."
 
  approval-granted:
    needs: request-approval-partner
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Send Approval Granted notification to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " PARTNER SQL DEPLOYMENT - APPROVAL GRANTED",
            "text": "**Production deployment has been approved and will now proceed**\n\n",
            "facts": [
              {
                "name": " Environment",
                "value": "Partner SQL (Production)"
              },
              {
                "name": " Approved by",
                "value": "${{ github.actor }}"
              },
              {
                "name": " Run ID",
                "value": "${{ github.run_id }}"
              }
            ],
            "themeColor": "00FF00"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
  
  deployment-started:
    needs: approval-granted
    runs-on: ubuntu-latest
    steps:
      - name: Send Deployment Started notification to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " PARTNER SQL DEPLOYMENT STARTED",
            "text": "**Production deployment is now in progress**\n\n",
            "facts": [
              {
                "name": " Environment",
                "value": "Partner SQL (Production)"
              },
              {
                "name": " Deployed by",
                "value": "${{ github.actor }}"
              },
              {
                "name": " Run ID",
                "value": "${{ github.run_id }}"
              }
            ],
            "themeColor": "1E90FF"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
 
  Production:
    needs: deployment-started
    uses: ./.github/workflows/reusable-sql-deploy.yml
    with:
      environment-name: partner-sql
    secrets: inherit
 
  notify-success:
    needs:
      - DevTest
      - Production
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Success Notification to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " SQL DEPLOYMENT SUCCESS",
            "text": "**All deployments completed successfully!**\n\n",
            "facts": [
              {
                "name": " DevTest Environment",
                "value": "Deployed Successfully"
              },
              {
                "name": " Partner Environment",
                "value": "Deployed Successfully"
              },
              {
                "name": " Deployed by",
                "value": "${{ github.actor }}"
              },
              {
                "name": " Branch",
                "value": "${{ github.ref_name }}"
              },
              {
                "name": " Run ID",
                "value": "${{ github.run_id }}"
              },
              {
                "name": " Commit",
                "value": "${{ github.sha }}"
              }
            ],
            "themeColor": "00FF00"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
 
  notify-failure:
    needs:
      - DevTest
      - Production
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Failure Notification to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " SQL DEPLOYMENT FAILED",
            "text": "**Deployment failure detected - immediate action required**\n\n",
            "facts": [
              {
                "name": " Status",
                "value": "Deployment Failed"
              },
              {
                "name": " Triggered by",
                "value": "${{ github.actor }}"
              },
              {
                "name": " Branch",
                "value": "${{ github.ref_name }}"
              },
              {
                "name": " Run ID",
                "value": "${{ github.run_id }}"
              },
              {
                "name": " Commit",
                "value": "${{ github.sha }}"
              }
            ],
            "potentialAction": "[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FF0000"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
