name: Deploy Local & Partner SQL
 
on:
  push:
    branches:
      - main
 
  workflow_dispatch:
 
jobs:
 
  DevTest:
    uses: ./.github/workflows/reusable-sql-deploy.yml
    with:
      environment-name: local-sql
    secrets: inherit
 
  request-approval-partner:
    needs: DevTest
    runs-on: ubuntu-latest
    environment: partner-sql  # This triggers GitHub's manual approval
 
    steps:
      - name: Send Partner approval request to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "PARTNER SQL DEPLOYMENT APPROVAL REQUIRED",
            "text": "**Partner database deployment requires approval**\n\n**Requested by:** ${{ github.actor }}\n**Local deployment completed successfully**\n**Run:** ${{ github.run_id }}\n\n[Open Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FFA500"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
 
      - name: Waiting for partner approval
        run: echo "Waiting for partner-sql approval..."
 
  Production:
    needs: request-approval-partner
    uses: ./.github/workflows/reusable-sql-deploy.yml
    with:
      environment-name: partner-sql
    secrets: inherit
 
  notify-success:
    needs:
      - DevTest
      - Production
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Success Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "SQL DEPLOYMENT SUCCESS",
            "text": "**Local and Partner deployments completed successfully**\nRun: ${{ github.run_id }}",
            "themeColor": "00FF00"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
 
  notify-failure:
    needs:
      - DevTest
      - Production
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Failure Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "SQL DEPLOYMENT FAILED",
            "text": "**One of the deployments failed**\n\nView logs:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "themeColor": "FF0000"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
