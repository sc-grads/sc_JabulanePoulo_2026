name: Deploy Local SQL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-local:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment_name: sql-deployment
      database_name: Cloud-tunnel-JP
      deployment_type: Local SQL Server
    secrets:
      teams_webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
