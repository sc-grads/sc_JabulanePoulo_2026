name: Reusable SQL Deployment Template

on:
  workflow_call:
    inputs:
      environment_name:
        description: 'GitHub Environment name for approval gate'
        required: true
        type: string
      database_name:
        description: 'Target database name'
        required: false
        type: string
        default: 'Cloud-tunnel-JP'
      deployment_type:
        description: 'Local or Partner deployment'
        required: true
        type: string
      # Remove secrets from here - they'll come from environment!
    secrets:
      teams_webhook_url:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment_name }}
  cancel-in-progress: true

jobs:
  request-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Send approval request to Teams
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TRIGGER_TYPE="Auto (Push)"
          else
            TRIGGER_TYPE="Manual"
          fi
          
          WEBHOOK_URL="${{ secrets.teams_webhook_url }}"
          
          if [ -n "$WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
            -d '{
              "title": " DEPLOYMENT APPROVAL REQUIRED",
              "text": "**Deployment Type:** ${{ inputs.deployment_type }}\n**Trigger:** '"$TRIGGER_TYPE"'\n**Database:** ${{ inputs.database_name }}\n**Requested by:** ${{ github.actor }}\n**Branch:** ${{ github.ref_name }}\n\n**To approve:** Go to GitHub Actions → Review deployments → Approve\n\n[Click to Review](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "themeColor": "FF0000"
            }' \
            "$WEBHOOK_URL"
          fi
      
      - name: Display approval waiting message
        run: |
          echo "========================================="
          echo " ${{ inputs.deployment_type }}"
          echo "========================================="
          echo "Waiting for approval in GitHub..."
          echo "Environment: ${{ inputs.environment_name }}"
          echo "========================================="

  deploy:
    needs: request-approval
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}  # This gives access to environment secrets!
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
      
      - name: Test SQL Server Connection
        env:
          # These come from the ENVIRONMENT secrets, not passed as parameters!
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Testing connection to SQL Server..."
          if /opt/mssql-tools18/bin/sqlcmd \
            -S "$SERVER" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -Q "SELECT 1" \
            -C -W -h -1 2>/dev/null | grep -q "1"; then
            echo " Connection successful"
          else
            echo " Cannot connect to SQL Server"
            exit 1
          fi
      
      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "========================================="
          echo "Deploying to: ${{ inputs.deployment_type }}"
          echo "========================================="
          
          /opt/mssql-tools18/bin/sqlcmd \
          -S "$SERVER" \
          -U "$USERNAME" \
          -P "$PASSWORD" \
          -d "master" \
          -i Database/deploy.sql \
          -C
      
      - name: Validate Deployment
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          DB_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "$SERVER" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -Q "SET NOCOUNT ON; IF DB_ID('$DATABASE_NAME') IS NOT NULL SELECT 1 ELSE SELECT 0" \
            -C -W -h -1)
          
          if [ "$(echo $DB_EXISTS | tr -d ' ')" = "1" ]; then
            echo " Database '$DATABASE_NAME' exists"
          else
            echo " Database validation failed"
            exit 1
          fi
      
      - name: Send success notification
        if: success()
        run: |
          WEBHOOK_URL="${{ secrets.teams_webhook_url }}"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
            -d '{"title":" Deployment Successful","text":"**${{ inputs.deployment_type }}**\nDatabase: ${{ inputs.database_name }}\nStatus: Success","themeColor":"00FF00"}' \
            "$WEBHOOK_URL"
          fi
      
      - name: Send failure notification
        if: failure()
        run: |
          WEBHOOK_URL="${{ secrets.teams_webhook_url }}"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
            -d '{"title":" Deployment Failed","text":"**${{ inputs.deployment_type }}**\nCheck GitHub Actions logs","themeColor":"FF0000"}' \
            "$WEBHOOK_URL"
          fi