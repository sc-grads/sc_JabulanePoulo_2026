name: Deploy Local SQL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Debug Teams Webhook
        run: |
          if [[ -n "${{ secrets.TEAMS_WEBHOOK_URL }}" ]]; then
            echo " TEAMS_WEBHOOK_URL secret is configured"
          else
            echo " TEAMS_WEBHOOK_URL secret is MISSING!"
            echo "Please add it in GitHub Settings"
          fi
      
      - name: Send started notification to Teams
        if: success()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{
            "title": " SQL Deployment Started",
            "text": "**Environment:** Local SQL Server\n**Database:** Cloud-tunnel-JP\n**Triggered by:** ${{ github.actor }}\n**Time:** ${{ github.run_started_at }}\n\n[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FFA500"
          }' \
          "${{ secrets.TEAMS_WEBHOOK_URL }}" || echo "Failed to send Teams notification"
      
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
      
      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
          -S "$SERVER" \
          -U "$USERNAME" \
          -P "$PASSWORD" \
          -d "master" \
          -i Database/deploy.sql \
          -C
      
      - name: Send success notification to Teams
        if: success()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{
            "title": " Deployment Successful!",
            "text": "**Environment:** Local SQL Server\n**Database:** Cloud-tunnel-JP\n**Status:**  Success\n**Completed:** $(date)\n\n[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "00FF00"
          }' \
          "${{ secrets.TEAMS_WEBHOOK_URL }}" || echo "Failed to send Teams notification"
      
      - name: Send failure notification to Teams
        if: failure()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{
            "title": " Deployment Failed!",
            "text": "**Environment:** Local SQL Server\n**Database:** Cloud-tunnel-JP\n**Status:**  Failed\n**Check logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "themeColor": "FF0000"
          }' \
          "${{ secrets.TEAMS_WEBHOOK_URL }}" || echo "Failed to send Teams notification"
