name: Reusable SQL Deployment

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string
      sql-script-path:
        required: true
        type: string
      deploy-ssis:
        required: false
        type: boolean
        default: false
      ssis-package-path:
        required: false
        type: string
        default: "ssis-packages/TimesheetMigration1.ispac"
      ssis-folder-name:
        required: false
        type: string
        default: "TimesheetDevTestMigration"    # Updated
      ssis-project-name:
        required: false
        type: string
        default: "TimesheetMigration1"          # Updated
    secrets:
      SQL_SERVER:
        required: true
      SQL_PORT:
        required: false
      SQL_USERNAME:
        required: true
      SQL_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Display Deployment Information
        run: |
          echo "==============================================="
          echo "SQL Deployment"
          echo "==============================================="
          echo "Environment : ${{ inputs.environment-name }}"
          echo "Server      : ${{ secrets.SQL_SERVER }}"
          echo "Script      : ${{ inputs.sql-script-path }}"
          echo "Deploy SSIS : ${{ inputs.deploy-ssis }}"
          echo "SSIS Package: ${{ inputs.ssis-package-path }}"
          echo "SSIS Folder : ${{ inputs.ssis-folder-name }}"
          echo "SSIS Project: ${{ inputs.ssis-project-name }}"
          echo "==============================================="

      # ... rest of your steps (similar to above)