name: Reusable SQL Deployment

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string
      sql-script-path:
        required: false
        type: string
        default: "scripts/create_database.sql"

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Debug Connection Details
        run: |
          echo "Server: ${{ secrets.SQL_SERVER }}"
          echo "Port: ${{ secrets.SQL_PORT }}"
          echo "Username: ${{ secrets.SQL_USERNAME }}"
          echo "Script Path: ${{ inputs.sql-script-path }}"

      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "master" \
            -i "${{ inputs.sql-script-path }}" \
            -C

      - name: Verify Deployment
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Verifying database deployment..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "TimesheetDB" \
            -Q "SELECT 'Database: TimesheetDB' as Status; SELECT COUNT(*) as EmployeeCount FROM timesheet.Employee; SELECT COUNT(*) as ClientCount FROM timesheet.Client;" \
            -C || echo "Verification queries may fail if tables are empty or database doesn't exist yet"