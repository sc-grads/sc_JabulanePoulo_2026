name: Reusable SQL Deployment

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string
      sql-script-path:
        required: true
        type: string
    secrets:
      SQL_SERVER:
        required: true
      SQL_PORT:
        required: false
      SQL_USERNAME:
        required: false
      SQL_PASSWORD:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Show Deployment Details
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
        run: |
          echo "======================================="
          echo "SQL Deployment"
          echo "======================================="
          echo "Server : $SERVER"
          echo "Environment : ${{ inputs.environment-name }}"
          echo "Script : ${{ inputs.sql-script-path }}"
          echo ""

      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Executing SQL script..."
          
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "${USERNAME}" \
            -P "${PASSWORD}" \
            -d master \
            -b \
            -i "${{ inputs.sql-script-path }}" \
            -C
          
          if [ $? -ne 0 ]; then
            echo " SQL deployment failed."
            exit 1
          fi
          
          echo " SQL deployment completed successfully."

      - name: Verify Deployment
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Verifying deployment..."
          
          EMPLOYEES=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "${USERNAME}" \
            -P "${PASSWORD}" \
            -d TimesheetDB \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM timesheet.Employee;" \
            -h -1 \
            -C | tr -d '[:space:]')
          
          CLIENTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "${USERNAME}" \
            -P "${PASSWORD}" \
            -d TimesheetDB \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM timesheet.Client;" \
            -h -1 \
            -C | tr -d '[:space:]')
          
          echo "Employees : $EMPLOYEES"
          echo "Clients   : $CLIENTS"
          
          if [ "$EMPLOYEES" -lt 1 ]; then
            echo " Employee table is empty."
            exit 1
          fi
          
          if [ "$CLIENTS" -lt 1 ]; then
            echo " Client table is empty."
            exit 1
          fi
          
          echo " Database verification successful."