name: Reusable SQL Deployment

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string

      sql-script-path:
        required: true
        type: string

    secrets:
      SQL_SERVER:
        required: true

      SQL_PORT:
        required: false

      SQL_USERNAME:
        required: true

      SQL_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc

          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
          | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Display Deployment Information
        env:
          SERVER: ${{ secrets.SQL_SERVER }}

        run: |
          echo "==============================================="
          echo "SQL Deployment"
          echo "==============================================="
          echo "Environment : ${{ inputs.environment-name }}"
          echo "Server      : $SERVER"
          echo "Script      : ${{ inputs.sql-script-path }}"
          echo "==============================================="

      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}

        run: |
          echo "Deploying database..."

          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -i "${{ inputs.sql-script-path }}" \
            -b \
            -C

          echo "Database deployment completed."

      - name: Verify Database Exists
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}

        run: |
          echo "Checking TimesheetsDB..."

          DB_EXISTS=$(
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d master \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='TimesheetDB';" \
              -h -1 \
              -C | tr -d '[:space:]'
          )

          echo "Database Exists = $DB_EXISTS"

          if [ "$DB_EXISTS" != "1" ]; then
            echo "TimesheetDB was not created."
            exit 1
          fi

      - name: Verify Employee Table
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}

        run: |
          EMPLOYEES=$(
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d TimesheetDB \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM timesheet.Employee;" \
              -h -1 \
              -C | tr -d '[:space:]'
          )

          echo "Employees = $EMPLOYEES"

          if [ "$EMPLOYEES" -lt 1 ]; then
            echo "Employee table verification failed."
            exit 1
          fi

      - name: Verify Client Table
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}

        run: |
          CLIENTS=$(
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d TimesheetDB \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM timesheet.Client;" \
              -h -1 \
              -C | tr -d '[:space:]'
          )

          echo "Clients = $CLIENTS"

          if [ "$CLIENTS" -lt 1 ]; then
            echo "Client table verification failed."
            exit 1
          fi

      - name: Deployment Complete
        run: |
          echo ""
          echo "==============================================="
          echo "Deployment completed successfully."
          echo "==============================================="