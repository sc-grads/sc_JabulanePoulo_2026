name: Deploy Local SQL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
      
      - name: Show connection info
        run: |
          echo "Attempting to connect to SQL Server..."
          echo "Server: kngsh-41-198-158-77.run.pinggy-free.link,36215"
          echo "Database: Cloud-tunnel-JP"
      
      - name: Execute SQL Script
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
          -S "oomnr-41-198-158-77.run.pinggy-free.link,42975" \
          -U "automation_user" \
          -P "Jabulane@123" \
          -d "Cloud-tunnel-JP" \
          -i Database/deploy.sql \
          -C
