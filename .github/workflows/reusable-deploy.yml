name: Reusable SQL Deployment

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string
      runner-label:
        required: true
        type: string
      sql-script-path:
        required: true
        type: string
      database-name:
        required: false
        type: string
        default: "TimesheetDB"
    secrets:
      SQL_SERVER:
        required: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - ${{ inputs.runner-label }}
    environment: ${{ inputs.environment-name }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Deployment Details
        shell: cmd
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          DB_NAME: ${{ inputs.database-name }}
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "Write-Host '======================================='; Write-Host 'SQL Deployment'; Write-Host '======================================='; Write-Host 'Server      : %SERVER%'; Write-Host 'Database    : %DB_NAME%'; Write-Host 'Runner      : ${{ inputs.runner-label }}'; Write-Host 'Script Path : ${{ inputs.sql-script-path }}'; Write-Host 'Auth Method : Windows Authentication'; Write-Host ''"

      - name: Test SQL Connection
        shell: cmd
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "$ErrorActionPreference='Stop'; Write-Host 'Testing SQL Server connection...'; try { sqlcmd -S %SERVER% -E -Q 'SELECT @@VERSION AS SQLVersion'; if ($LASTEXITCODE -ne 0) { throw 'Failed to connect to SQL Server.' }; Write-Host 'Connection successful.' } catch { Write-Host 'Connection failed: ' $_; throw }"

      - name: Execute SQL Script
        shell: cmd
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          DB_NAME: ${{ inputs.database-name }}
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "$ErrorActionPreference='Stop'; Write-Host 'Executing deployment script...'; $ScriptPath = '${{ inputs.sql-script-path }}'; if (-not (Test-Path $ScriptPath)) { Write-Host 'Script not found: ' $ScriptPath; throw 'SQL script not found' }; Write-Host 'Script content preview:'; Get-Content $ScriptPath -TotalCount 5; sqlcmd -S %SERVER% -E -d master -b -i $ScriptPath; if ($LASTEXITCODE -ne 0) { throw 'SQL deployment failed with exit code: $LASTEXITCODE' }; Write-Host 'Deployment completed.'"

      - name: Verify Deployment
        shell: cmd
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          DB_NAME: ${{ inputs.database-name }}
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "$ErrorActionPreference='Stop'; Write-Host 'Verifying deployment...'; $DbExists = (sqlcmd -S %SERVER% -E -d master -Q 'SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name=''%DB_NAME%''' -h -1).Trim(); if ($DbExists -ne '1') { Write-Host 'Database not found.'; throw 'Database verification failed.' }; Write-Host 'Database exists.'; $TableCount = (sqlcmd -S %SERVER% -E -d %DB_NAME% -Q 'SET NOCOUNT ON; SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE = ''BASE TABLE''' -h -1).Trim(); if ([int]$TableCount -lt 1) { throw 'No tables found in database.' }; Write-Host 'Tables found: ' $TableCount; Write-Host 'Database verification successful.'"