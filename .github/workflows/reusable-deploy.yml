name: Reusable SQL Deployment

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string
      sql-script-path:
        required: true
        type: string
      deploy-ssis:
        required: false
        type: boolean
        default: false
      ssis-package-path:
        required: false
        type: string
        default: "ssis-packages/TimesheetDevTestMigrationPK.ispac"
      ssis-folder-name:
        required: false
        type: string
        default: "TimesheetDevTestMigration"
      ssis-project-name:
        required: false
        type: string
        default: "TimesheetDevTestMigrationPK"
      database-name:
        required: false
        type: string
        default: "Timesheet-JP-DB"
    secrets:
      SQL_SERVER:
        required: true
      SQL_PORT:
        required: false
      SQL_USERNAME:
        required: true
      SQL_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Display Deployment Information
        run: |
          echo "==============================================="
          echo "SQL Deployment"
          echo "==============================================="
          echo "Environment    : ${{ inputs.environment-name }}"
          echo "Server         : ${{ secrets.SQL_SERVER }}"
          echo "Script         : ${{ inputs.sql-script-path }}"
          echo "Deploy SSIS    : ${{ inputs.deploy-ssis }}"
          echo "SSIS Package   : ${{ inputs.ssis-package-path }}"
          echo "SSIS Folder    : ${{ inputs.ssis-folder-name }}"
          echo "SSIS Project   : ${{ inputs.ssis-project-name }}"
          echo "Database Name  : ${{ inputs.database-name }}"
          echo "==============================================="

      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
          DB_NAME: ${{ inputs.database-name }}
        run: |
          echo "Deploying database: $DB_NAME..."
          
          # Replace database name in script
          sed -i "s/TimesheetsDB/$DB_NAME/g" "${{ inputs.sql-script-path }}"
          
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -i "${{ inputs.sql-script-path }}" \
            -b \
            -C
          
          echo "Database deployment completed."

      - name: Check and Create SSISDB if Needed
        if: ${{ inputs.deploy-ssis == true }}
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Checking if SSISDB exists..."
          
          SSISDB_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$SSISDB_EXISTS" == "0" ]; then
            echo "SSISDB does not exist. Creating SSISDB..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d master \
              -Q "EXEC [master].[sys].[sp_ssis_catalog] @operation='create_catalog', @password='${{ secrets.SQL_PASSWORD }}';" \
              -C
            echo "SSISDB created successfully."
          else
            echo "SSISDB already exists."
          fi

      - name: Create SSIS Folder
        if: ${{ inputs.deploy-ssis == true }}
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          FOLDER_NAME="${{ inputs.ssis-folder-name }}"
          echo "Creating SSIS folder: $FOLDER_NAME"
          
          FOLDER_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name='$FOLDER_NAME'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$FOLDER_EXISTS" == "0" ]; then
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d SSISDB \
              -Q "EXEC [SSISDB].[catalog].[create_folder] @folder_name=N'$FOLDER_NAME', @folder_id=0;" \
              -C
            echo "Folder '$FOLDER_NAME' created successfully."
          else
            echo "Folder '$FOLDER_NAME' already exists."
          fi

      - name: Deploy SSIS Package
        if: ${{ inputs.deploy-ssis == true }}
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          PACKAGE_PATH="${{ inputs.ssis-package-path }}"
          FOLDER_NAME="${{ inputs.ssis-folder-name }}"
          PROJECT_NAME="${{ inputs.ssis-project-name }}"
          
          echo "Deploying SSIS package: $PACKAGE_PATH"
          
          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "Error: Package file $PACKAGE_PATH not found!"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
          
          # Convert .ispac to base64
          echo "Converting package to base64..."
          PACKAGE_BASE64=$(base64 -w 0 "$PACKAGE_PATH")
          
          # Deploy using T-SQL
          echo "Deploying package to SSISDB..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -Q "
              DECLARE @folder_id bigint;
              DECLARE @project_id bigint;
              DECLARE @operation_id bigint;
              DECLARE @project_binary varbinary(max);
              
              SELECT @folder_id = folder_id 
              FROM [SSISDB].[catalog].[folders] 
              WHERE name = '$FOLDER_NAME';
              
              SET @project_binary = CAST(N'' AS XML).value('xs:base64Binary(sql:variable(\"@base64\"))', 'varbinary(max)');
              
              EXEC [SSISDB].[catalog].[deploy_project] 
                @folder_name = '$FOLDER_NAME',
                @project_name = '$PROJECT_NAME',
                @project_stream = @project_binary,
                @operation_id = @operation_id OUTPUT;
              
              SELECT 'Deployment successful' as Status, @operation_id as OperationID;
            " \
            -v base64="$PACKAGE_BASE64" \
            -C
          
          echo "SSIS package deployed successfully."

      - name: Verify Database
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
          DB_NAME: ${{ inputs.database-name }}
        run: |
          echo "Verifying database deployment..."
          
          # Check database exists
          DB_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='$DB_NAME';" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$DB_EXISTS" != "1" ]; then
            echo "$DB_NAME was not created."
            exit 1
          fi
          
          # Check Employee table
          EMPLOYEES=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "$DB_NAME" \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM timesheet.Employee;" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$EMPLOYEES" -lt 1 ]; then
            echo "Employee table verification failed."
            exit 1
          fi
          
          # Check Client table
          CLIENTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "$DB_NAME" \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM timesheet.Client;" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$CLIENTS" -lt 1 ]; then
            echo "Client table verification failed."
            exit 1
          fi
          
          echo "Database verification completed successfully."

      - name: Verify SSIS Deployment
        if: ${{ inputs.deploy-ssis == true }}
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Verifying SSIS deployment..."
          
          FOLDER_NAME="${{ inputs.ssis-folder-name }}"
          PROJECT_NAME="${{ inputs.ssis-project-name }}"
          
          PROJECT_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -Q "SET NOCOUNT ON; 
                SELECT COUNT(*) 
                FROM [SSISDB].[catalog].[projects] p
                INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                WHERE f.name = '$FOLDER_NAME' 
                  AND p.name = '$PROJECT_NAME'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$PROJECT_EXISTS" -eq "1" ]; then
            echo "SSIS deployment verified successfully!"
          else
            echo "Warning: SSIS project not found in SSISDB."
          fi

      - name: Deployment Complete
        run: |
          echo ""
          echo "==============================================="
          echo "Deployment completed successfully."
          echo "==============================================="