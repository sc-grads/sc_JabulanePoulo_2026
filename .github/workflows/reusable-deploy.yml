name: Reusable SQL Deployment

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string
      sql-script-path:
        required: false
        type: string
        default: "scripts/create_database.sql"
      runner-label:
        required: false
        type: string
        default: "self-hosted"

jobs:
  deploy:
    runs-on: [self-hosted, ${{ inputs.runner-label }}]
    
    environment: ${{ inputs.environment-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Connection Details
        run: |
          echo "Server: ${{ secrets.SQL_SERVER }}"
          echo "Database: TimesheetDB"
          echo "Script Path: ${{ inputs.sql-script-path }}"
          echo "Runner: ${{ inputs.runner-label }}"
        shell: pwsh

      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          DATABASE: TimesheetDB
        run: |
          Write-Host "Creating database and tables on $env:SERVER..."
          
          # Using sqlcmd with Windows Authentication
          sqlcmd -S "$env:SERVER" -d "master" -i "${{ inputs.sql-script-path }}" -b
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host " SQL script execution failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          Write-Host " SQL script executed successfully."
        shell: pwsh

      - name: Verify Deployment
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          DATABASE: TimesheetDB
        run: |
          Write-Host "Verifying database deployment..."
          
          $EmployeeCount = sqlcmd -S "$env:SERVER" -d "TimesheetDB" -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM timesheet.Employee" -h-1
          $ClientCount = sqlcmd -S "$env:SERVER" -d "TimesheetDB" -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM timesheet.Client" -h-1
          
          Write-Host "Employee Count: $EmployeeCount"
          Write-Host "Client Count: $ClientCount"
          
          if ($EmployeeCount -gt 0 -and $ClientCount -gt 0) {
            Write-Host " Database verification successful!"
          }
          else {
            Write-Host " Database verification completed with warnings."
          }
        shell: pwsh