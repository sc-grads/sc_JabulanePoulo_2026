name: 01 - Build SSIS Package

on:
  push:
    branches: [main]
    paths:
      - 'TimesheetMigration1/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: ''

jobs:
  build-ssis:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Build SSIS Package
        run: |
          echo " Building SSIS Package..."
          msbuild TimesheetMigration1.dtproj /p:Configuration=Release /p:OutputPath=.\bin\
      
      - name: Upload SSIS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssis-package-${{ github.run_number }}
          path: .\bin\*.ispac
          retention-days: 30
      
      - name: Send Teams Notification
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": " SSIS BUILD SUCCESS",
            "text": "**SSIS Package built successfully**",
            "facts": [
              {"name": "Version", "value": "${{ github.event.inputs.version || github.run_number }}"},
              {"name": "Built by", "value": "${{ github.actor }}"},
              {"name": "Run", "value": "${{ github.run_number }}"}
            ],
            "themeColor": "00FF00"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}