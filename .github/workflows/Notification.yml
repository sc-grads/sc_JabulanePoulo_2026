name: GitHub-MS Teams Events Integration

on:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  create:
  pull_request_review:
    types: [submitted]

jobs:
  notify-teams:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to MS Teams
        run: |
          EVENT_NAME="${{ github.event_name }}"
          EVENT_ACTION="${{ github.event.action }}"

          if [ "$EVENT_NAME" = "push" ]; then
            MESSAGE="**Push event** in ${{ github.repository }} by ${{ github.actor }}.\n\nCommit: ${{ github.event.head_commit.message }}\n${{ github.event.head_commit.url }}"

          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "opened" ]; then
            MESSAGE=" **Approval required**: Pull Request #${{ github.event.pull_request.number }} opened in ${{ github.repository }} by ${{ github.actor }}.\n\nTitle: ${{ github.event.pull_request.title }}\nAssigned reviewer(s): ${{ join(github.event.pull_request.requested_reviewers.*.login, ', ') }}\n${{ github.event.pull_request.html_url }}"

          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "reopened" ]; then
            MESSAGE=" **Approval required again**: Pull Request #${{ github.event.pull_request.number }} reopened in ${{ github.repository }} by ${{ github.actor }}.\n\nTitle: ${{ github.event.pull_request.title }}\n${{ github.event.pull_request.html_url }}"

          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            REVIEW_STATE="${{ github.event.review.state }}"
            if [ "$REVIEW_STATE" = "approved" ]; then
              MESSAGE=" **Approval Received for Merge!** 🎉\n\nPR #${{ github.event.pull_request.number }} in ${{ github.repository }} has been approved by ${{ github.actor }}.\n\nTitle: ${{ github.event.pull_request.title }}\n${{ github.event.pull_request.html_url }}"
            else
              MESSAGE="**Review update**: Pull Request #${{ github.event.pull_request.number }} reviewed in ${{ github.repository }} by ${{ github.actor }}.\n\nDecision: $REVIEW_STATE\n${{ github.event.pull_request.html_url }}"
            fi

          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "closed" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            MESSAGE=" **Merge complete**: Pull Request #${{ github.event.pull_request.number }} merged into main in ${{ github.repository }} by ${{ github.actor }}.\n${{ github.event.pull_request.html_url }}"

          elif [ "$EVENT_NAME" = "create" ]; then
            REF_TYPE="${{ github.event.ref_type }}"
            REF_NAME="${{ github.event.ref }}"

            if [ "$REF_TYPE" = "branch" ]; then
              MESSAGE=" **Branch created**: $REF_NAME in ${{ github.repository }} by ${{ github.actor }}.\nThis branch is now available for new work.\n${{ github.server_url }}/${{ github.repository }}/tree/$REF_NAME"
            elif [ "$REF_TYPE" = "tag" ]; then
              MESSAGE=" **Tag created**: $REF_NAME in ${{ github.repository }} by ${{ github.actor }}.\nThis tag may represent a release.\n${{ github.server_url }}/${{ github.repository }}/releases/tag/$REF_NAME"
            else
              MESSAGE="**Other create event**: $REF_TYPE $REF_NAME in ${{ github.repository }} by ${{ github.actor }}."
            fi

          else
            MESSAGE="**Other event** in ${{ github.repository }} by ${{ github.actor }}.\nRef: ${{ github.ref }}"
          fi

          curl -H "Content-Type: application/json" \
          -d "{\"text\": \"$MESSAGE\"}" \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
