name: Deploy Database and Run Migration
run-name: "${{ github.event_name == 'push' && format('Deploy {0} - {1}', github.ref_name, github.sha) || 'Manual Deployment' }}"

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_to_devtest:
        description: 'Deploy to DevTest environment'
        type: boolean
        default: true
      deploy_to_partner:
        description: 'Deploy to Partner environment'
        type: boolean
        default: true

jobs:
  # =============================================
  # Deploy to DevTest Environment
  # =============================================
  DevTest:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: local-sql
      sql-script-path: scripts/create_database.sql
      deployment-name: "DevTest"
    secrets: inherit

  # =============================================
  # Run Migration Job on DevTest
  # =============================================
  RunMigrationJob-DevTest:
    needs: DevTest
    runs-on: ubuntu-latest
    environment: local-sql
    if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_to_devtest == 'true')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Check, Create, and Run TimesheetMigration Job - DevTest
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "========================================="
          echo "🏗️ DevTest Environment - Job Management"
          echo "========================================="
          chmod +x scripts/manage_migration_job.sh
          bash scripts/manage_migration_job.sh

  # =============================================
  # Deploy to Partner Environment
  # =============================================
  Partner:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: partner-sql
      sql-script-path: scripts/create_database.sql
      deployment-name: "Partner"
    secrets: inherit

  # =============================================
  # Run Migration Job on Partner
  # =============================================
  RunMigrationJob-Partner:
    needs: Partner
    runs-on: ubuntu-latest
    environment: partner-sql
    if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_to_partner == 'true')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Check, Create, and Run TimesheetMigration Job - Partner
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "========================================="
          echo " Partner Environment - Job Management"
          echo "========================================="
          chmod +x scripts/manage_migration_job.sh
          bash scripts/manage_migration_job.sh

  # =============================================
  # Notifications - Success
  # =============================================
  notify-success:
    needs:
      - DevTest
      - RunMigrationJob-DevTest
      - Partner
      - RunMigrationJob-Partner
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Send Success Notification to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            ENVIRONMENTS=""
            if [ "${{ needs.DevTest.result }}" == "success" ]; then
              ENVIRONMENTS="${ENVIRONMENTS} DevTest, "
            fi
            if [ "${{ needs.Partner.result }}" == "success" ]; then
              ENVIRONMENTS="${ENVIRONMENTS} Partner, "
            fi
            ENVIRONMENTS=${ENVIRONMENTS%, }
            
            curl -H "Content-Type: application/json" \
            -d '{
              "title": " SQL DEPLOYMENT SUCCESS",
              "text": "**Multi-environment deployment completed successfully!**\n\n",
              "facts": [
                {
                  "name": " Environments Deployed",
                  "value": "'"$ENVIRONMENTS"'"
                },
                {
                  "name": " Database",
                  "value": "TimesheetDB"
                },
                {
                  "name": " Migration Jobs",
                  "value": "Executed Successfully"
                },
                {
                  "name": " Deployed by",
                  "value": "${{ github.actor }}"
                },
                {
                  "name": " Branch",
                  "value": "${{ github.ref_name }}"
                },
                {
                  "name": " Run ID",
                  "value": "${{ github.run_id }}"
                },
                {
                  "name": " Commit",
                  "value": "${{ github.sha }}"
                }
              ],
              "themeColor": "00FF00"
            }' \
            $TEAMS_WEBHOOK_URL
          else
            echo " TEAMS_WEBHOOK_URL not set, skipping notification"
          fi

  # =============================================
  # Notifications - Failure
  # =============================================
  notify-failure:
    needs:
      - DevTest
      - RunMigrationJob-DevTest
      - Partner
      - RunMigrationJob-Partner
    if: always() && (failure() || cancelled())
    runs-on: ubuntu-latest
    steps:
      - name: Send Failure Notification to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            FAILED_STAGE=""
            FAILED_ENV=""
            
            if [ "${{ needs.DevTest.result }}" == "failure" ]; then
              FAILED_ENV="DevTest"
              FAILED_STAGE="Database Deployment"
            elif [ "${{ needs.RunMigrationJob-DevTest.result }}" == "failure" ]; then
              FAILED_ENV="DevTest"
              FAILED_STAGE="Job Execution"
            elif [ "${{ needs.RunMigrationJob-DevTest.result }}" == "cancelled" ]; then
              FAILED_ENV="DevTest"
              FAILED_STAGE="Job Cancelled"
            elif [ "${{ needs.Partner.result }}" == "failure" ]; then
              FAILED_ENV="Partner"
              FAILED_STAGE="Database Deployment"
            elif [ "${{ needs.RunMigrationJob-Partner.result }}" == "failure" ]; then
              FAILED_ENV="Partner"
              FAILED_STAGE="Job Execution"
            elif [ "${{ needs.RunMigrationJob-Partner.result }}" == "cancelled" ]; then
              FAILED_ENV="Partner"
              FAILED_STAGE="Job Cancelled"
            else
              FAILED_ENV="Unknown"
              FAILED_STAGE="Unknown Stage"
            fi
            
            curl -H "Content-Type: application/json" \
            -d '{
              "title": " SQL DEPLOYMENT FAILED",
              "text": "**Multi-environment deployment failure detected - immediate action required**\n\n",
              "facts": [
                {
                  "name": " Status",
                  "value": "Deployment Failed"
                },
                {
                  "name": " Failed Environment",
                  "value": "'"$FAILED_ENV"'"
                },
                {
                  "name": " Failed Stage",
                  "value": "'"$FAILED_STAGE"'"
                },
                {
                  "name": " Database",
                  "value": "TimesheetDB"
                },
                {
                  "name": " Triggered by",
                  "value": "${{ github.actor }}"
                },
                {
                  "name": " Branch",
                  "value": "${{ github.ref_name }}"
                },
                {
                  "name": " Run ID",
                  "value": "${{ github.run_id }}"
                },
                {
                  "name": " Commit",
                  "value": "${{ github.sha }}"
                },
                {
                  "name": " Time",
                  "value": "${{ github.event.head_commit.timestamp }}"
                }
              ],
              "potentialAction": "[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
              "themeColor": "FF0000"
            }' \
            $TEAMS_WEBHOOK_URL
          else
            echo " TEAMS_WEBHOOK_URL not set, skipping notification"
          fi