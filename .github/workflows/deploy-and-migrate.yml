name: Pinggys SSIS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Stage: DevTest/Deploy
  # ==========================================
  DevTest_Deploy:
    name: DevTest/Deploy
    runs-on: windows-latest                    # Changed to Windows
    environment: local-sql
    continue-on-error: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          Write-Host "Deploying TimesheetsDB to DevTest..."
          sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d master -i "scripts/create_database.sql" -b
          Write-Host "Database deployment completed."

      # --- STEP 2: Initialize SSIS Catalog ---
      - name: Initialize SSIS Catalog (SSISDB) if Missing
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          $exists = sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d master -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" -h-1 | Select-Object -First 1
          if ($exists -eq 0) {
            Write-Host "Creating SSISDB..."
            sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d master -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '$env:PASSWORD';"
            Write-Host "SSISDB created successfully."
          } else {
            Write-Host "SSISDB already exists."
          }

      # --- STEP 3: CREATE SSIS FOLDER ---
      - name: Create SSIS Folder
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          $folderName = "TimesheetDevTestMigration"
          $exists = sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d SSISDB -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [catalog].[folders] WHERE name='$folderName'" -h-1 | Select-Object -First 1
          
          if ($exists -eq 0) {
            Write-Host "Creating folder '$folderName'..."
            sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d SSISDB -Q "EXEC [catalog].[create_folder] @folder_name=N'$folderName';"
            Write-Host "Folder created successfully."
          } else {
            Write-Host "Folder '$folderName' already exists."
          }

      # --- STEP 4: DELETE EXISTING PROJECT ---
      - name: Delete Existing Project (if exists)
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          $folderName = "TimesheetDevTestMigration"
          $projectName = "TimesheetMigration1"
          
          $exists = sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d SSISDB `
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [catalog].[projects] p JOIN [catalog].[folders] f ON p.folder_id = f.folder_id WHERE f.name = '$folderName' AND p.name = '$projectName'" -h-1 | Select-Object -First 1
          
          if ($exists -eq 1) {
            Write-Host "Deleting existing project '$projectName'..."
            sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d SSISDB -Q "
              DECLARE @project_id bigint = (SELECT p.project_id FROM [catalog].[projects] p 
                JOIN [catalog].[folders] f ON p.folder_id = f.folder_id 
                WHERE f.name = '$folderName' AND p.name = '$projectName');
              IF @project_id IS NOT NULL EXEC [catalog].[delete_project] @project_id = @project_id;"
            Write-Host "Project deleted."
          }

      # --- STEP 5: DEPLOY SSIS PACKAGE (PowerShell - Fixed) ---
      - name: Deploy SSIS Package (.ispac) to DevTest
        id: deploy_ssis
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          $packagePath = "ssis-packages/TimesheetMigration1.ispac"
          $folderName = "TimesheetDevTestMigration"
          $projectName = "TimesheetMigration1"

          if (-not (Test-Path $packagePath)) {
            Write-Error "Package not found at: $packagePath"
            exit 1
          }

          Write-Host "Loading Integration Services assembly..."
          [System.Reflection.Assembly]::LoadWithPartialName("Microsoft.SqlServer.Management.IntegrationServices") | Out-Null

          $connString = "Data Source=$env:SERVER;Initial Catalog=SSISDB;User ID=$env:USERNAME;Password=$env:PASSWORD;"
          $conn = New-Object System.Data.SqlClient.SqlConnection($connString)
          $conn.Open()

          $integrationServices = New-Object Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices($conn)
          $catalog = $integrationServices.Catalogs["SSISDB"]

          # Create folder if it doesn't exist
          if (-not $catalog.Folders.Contains($folderName)) {
            Write-Host "Creating folder '$folderName'..."
            $folder = New-Object Microsoft.SqlServer.Management.IntegrationServices.CatalogFolder($catalog, $folderName, "Timesheet Migration Folder")
            $folder.Create()
          } else {
            $folder = $catalog.Folders[$folderName]
          }

          Write-Host "Deploying project '$projectName'..."
          $projectBytes = [System.IO.File]::ReadAllBytes($packagePath)
          $folder.DeployProject($projectName, $projectBytes)

          Write-Host "✅ SSIS Project deployed successfully!"
          "DEPLOYMENT_STATUS=success" >> $env:GITHUB_OUTPUT

          $conn.Close()

      # --- STEP 6: VERIFY DEPLOYMENT ---
      - name: Verify SSIS Deployment
        if: steps.deploy_ssis.outputs.DEPLOYMENT_STATUS == 'success'
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          $folderName = "TimesheetDevTestMigration"
          $projectName = "TimesheetMigration1"
          
          $exists = sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d SSISDB `
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [catalog].[projects] p JOIN [catalog].[folders] f ON p.folder_id = f.folder_id WHERE f.name = '$folderName' AND p.name = '$projectName'" -h-1 | Select-Object -First 1
          
          if ($exists -eq 1) {
            Write-Host "✅ SSIS deployment verified successfully!"
          } else {
            Write-Error "SSIS project not found after deployment."
            exit 1
          }

      # --- STEP 7: CREATE JOB ---
      - name: Create DevTest SQL Agent Job
        if: always()
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          if (Test-Path "scripts/create_job.sql") {
            Write-Host "Creating SQL Agent Job..."
            sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d msdb -i "scripts/create_job.sql"
            Write-Host "Job created."
          } else {
            Write-Host "create_job.sql not found, skipping."
          }

      # --- STEP 8: RUN THE JOB ---
      - name: Run DevTest Migration Job
        if: always()
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          Write-Host "Starting SQL Agent Job..."
          sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d msdb -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" 2>$null || Write-Host "Job start command issued (may not exist yet)."

  # ==========================================
  # 2. Stage: Production/Deploy
  # ==========================================
  Production_Deploy:
    name: Production/Deploy
    runs-on: windows-latest                    # Changed to Windows
    needs: DevTest_Deploy
    environment: partner-sql
    if: success()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Production steps follow the same pattern as DevTest
      # (Database, Catalog, Folder, Delete, Deploy, Verify, Job)

      - name: Deploy SQL Database Script (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        shell: pwsh
        run: |
          Write-Host "Deploying TimesheetsDB to Production (Partner)..."
          sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d master -i "scripts/create_database.sql" -b

      # ... (You can duplicate the same pattern as DevTest for the remaining steps with Partner secrets)

      - name: Deploy SSIS Package (.ispac) to Partner
        id: deploy_ssis_partner
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        shell: pwsh
        run: |
          $packagePath = "ssis-packages/TimesheetMigration1.ispac"
          $folderName = "TimesheetDevTestMigration"
          $projectName = "TimesheetMigration1"

          [System.Reflection.Assembly]::LoadWithPartialName("Microsoft.SqlServer.Management.IntegrationServices") | Out-Null

          $conn = New-Object System.Data.SqlClient.SqlConnection("Data Source=$env:SERVER;Initial Catalog=SSISDB;User ID=$env:USERNAME;Password=$env:PASSWORD;")
          $conn.Open()
          $intgSvc = New-Object Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices $conn
          $catalog = $intgSvc.Catalogs["SSISDB"]

          if (-not $catalog.Folders.Contains($folderName)) {
            $folder = New-Object Microsoft.SqlServer.Management.IntegrationServices.CatalogFolder($catalog, $folderName, "")
            $folder.Create()
          } else {
            $folder = $catalog.Folders[$folderName]
          }

          $bytes = [IO.File]::ReadAllBytes($packagePath)
          $folder.DeployProject($projectName, $bytes)
          Write-Host "✅ Partner SSIS Project deployed successfully!"
          "DEPLOYMENT_STATUS=success" >> $env:GITHUB_OUTPUT
          $conn.Close()