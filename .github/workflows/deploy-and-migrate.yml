name: Pinggys SSIS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Stage: DevTest/Deploy
  # ==========================================
  DevTest_Deploy:
    name: DevTest/Deploy
    runs-on: windows-latest  # Changed to Windows
    environment: local-sql
    continue-on-error: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SQL Server Management Tools
        run: |
          choco install sqlserver-cmdlineutils -y
          choco install sqlserver-ssms -y

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d master -i "scripts/create_database.sql" -b

      # --- STEP 2: SSIS CATALOG ---
      - name: Initialize SSIS Catalog (SSISDB) if Missing
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $SSISDBExists = sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d master -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" -h-1
          $SSISDBExists = $SSISDBExists.Trim()
          
          if ($SSISDBExists -eq "0") {
            Write-Host "Creating SSISDB..."
            sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d master -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '$env:SQL_PASSWORD';"
            Write-Host "SSISDB created successfully."
          } else {
            Write-Host "SSISDB already exists."
          }

      # --- STEP 3: CREATE SSIS FOLDER ---
      - name: Create SSIS Folder
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $FOLDER_NAME = "TimesheetDevTestMigration"
          
          $FolderExists = sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d SSISDB -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name='$FOLDER_NAME'" -h-1
          $FolderExists = $FolderExists.Trim()
          
          if ($FolderExists -eq "0") {
            Write-Host "Creating folder '$FOLDER_NAME'..."
            sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d SSISDB -Q "EXEC [SSISDB].[catalog].[create_folder] @folder_name=N'$FOLDER_NAME', @folder_id=0;"
            Write-Host "Folder created successfully."
          } else {
            Write-Host "Folder already exists."
          }

      # --- STEP 4: DEPLOY SSIS PACKAGE USING POWERSHELL ---
      - name: Deploy SSIS Package
        id: deploy_ssis
        shell: powershell
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          Add-Type -AssemblyName "Microsoft.SqlServer.Management.IntegrationServices, Version=15.0.0.0, Culture=neutral, PublicKeyToken=89845dcd8080cc91"
          
          $PACKAGE_PATH = "ssis-packages/TimesheetMigration1.ispac"
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          $SERVER = "${env:SERVER},${env:PORT}"
          
          if (-not (Test-Path $PACKAGE_PATH)) {
            Write-Error "Package file $PACKAGE_PATH not found!"
            exit 1
          }
          
          # Load the .ispac file
          $ProjectBytes = [System.IO.File]::ReadAllBytes($PACKAGE_PATH)
          
          # Connect to SQL Server using SQL Authentication
          $ConnectionString = "Data Source=$SERVER;User ID=${env:USERNAME};Password=${env:PASSWORD}"
          
          $SqlConnection = New-Object System.Data.SqlClient.SqlConnection($ConnectionString)
          $IntegrationServices = New-Object Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices($SqlConnection)
          
          # Get folder
          $Folder = $IntegrationServices.Catalogs["SSISDB"].Folders[$FOLDER_NAME]
          
          if ($Folder -eq $null) {
            Write-Error "Folder $FOLDER_NAME does not exist!"
            exit 1
          }
          
          # Delete existing project if it exists
          $ExistingProject = $Folder.Projects[$PROJECT_NAME]
          if ($ExistingProject -ne $null) {
            Write-Host "Deleting existing project: $PROJECT_NAME"
            $ExistingProject.Drop()
          }
          
          # Deploy new project
          Write-Host "Deploying project: $PROJECT_NAME"
          $Folder.DeployProject($PROJECT_NAME, $ProjectBytes)
          
          Write-Host "SSIS package deployed successfully!"
          Write-Host "DEPLOYMENT_STATUS=success" >> $env:GITHUB_OUTPUT

      # --- STEP 5: VERIFY DEPLOYMENT ---
      - name: Verify SSIS Deployment
        if: steps.deploy_ssis.outputs.DEPLOYMENT_STATUS == 'success'
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          
          $ProjectExists = sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d SSISDB -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[projects] p INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id WHERE f.name = '$FOLDER_NAME' AND p.name = '$PROJECT_NAME'" -h-1
          $ProjectExists = $ProjectExists.Trim()
          
          if ($ProjectExists -eq "1") {
            Write-Host "SSIS deployment verified successfully!"
          } else {
            Write-Error "SSIS project not found!"
            exit 1
          }

      # --- STEP 6: CREATE AND RUN JOB ---
      - name: Create and Run SQL Agent Job
        if: always()
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          if (Test-Path "scripts/create_job.sql") {
            Write-Host "Creating SQL Agent Job..."
            sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d msdb -i "scripts/create_job.sql"
            
            Write-Host "Starting SQL Agent Job..."
            sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d msdb -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';"
          } else {
            Write-Host "create_job.sql not found, skipping job creation."
          }

  # ==========================================
  # 2. Stage: Production/Deploy
  # ==========================================
  Production_Deploy:
    name: Production/Deploy
    runs-on: windows-latest
    needs: DevTest_Deploy
    environment: partner-sql
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SQL Server Management Tools
        run: |
          choco install sqlserver-cmdlineutils -y
          choco install sqlserver-ssms -y

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d master -i "scripts/create_database.sql" -b

      # --- STEP 2: SSIS CATALOG ---
      - name: Initialize SSIS Catalog (SSISDB) if Missing (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          $SSISDBExists = sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d master -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" -h-1
          $SSISDBExists = $SSISDBExists.Trim()
          
          if ($SSISDBExists -eq "0") {
            Write-Host "Creating SSISDB (Partner)..."
            sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d master -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '$env:PARTNER_SQL_PASSWORD';"
            Write-Host "SSISDB created successfully (Partner)."
          } else {
            Write-Host "SSISDB already exists (Partner)."
          }

      # --- STEP 3: CREATE SSIS FOLDER ---
      - name: Create SSIS Folder (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          $FOLDER_NAME = "TimesheetDevTestMigration"
          
          $FolderExists = sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d SSISDB -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name='$FOLDER_NAME'" -h-1
          $FolderExists = $FolderExists.Trim()
          
          if ($FolderExists -eq "0") {
            Write-Host "Creating folder '$FOLDER_NAME' (Partner)..."
            sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d SSISDB -Q "EXEC [SSISDB].[catalog].[create_folder] @folder_name=N'$FOLDER_NAME', @folder_id=0;"
            Write-Host "Folder created successfully (Partner)."
          } else {
            Write-Host "Folder already exists (Partner)."
          }

      # --- STEP 4: DEPLOY SSIS PACKAGE USING POWERSHELL ---
      - name: Deploy SSIS Package (Partner)
        id: deploy_ssis_partner
        shell: powershell
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          Add-Type -AssemblyName "Microsoft.SqlServer.Management.IntegrationServices, Version=15.0.0.0, Culture=neutral, PublicKeyToken=89845dcd8080cc91"
          
          $PACKAGE_PATH = "ssis-packages/TimesheetMigration1.ispac"
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          $SERVER = "${env:SERVER},${env:PORT}"
          
          if (-not (Test-Path $PACKAGE_PATH)) {
            Write-Error "Package file $PACKAGE_PATH not found!"
            exit 1
          }
          
          $ProjectBytes = [System.IO.File]::ReadAllBytes($PACKAGE_PATH)
          
          $ConnectionString = "Data Source=$SERVER;User ID=${env:USERNAME};Password=${env:PASSWORD}"
          
          $SqlConnection = New-Object System.Data.SqlClient.SqlConnection($ConnectionString)
          $IntegrationServices = New-Object Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices($SqlConnection)
          
          $Folder = $IntegrationServices.Catalogs["SSISDB"].Folders[$FOLDER_NAME]
          
          if ($Folder -eq $null) {
            Write-Error "Folder $FOLDER_NAME does not exist (Partner)!"
            exit 1
          }
          
          $ExistingProject = $Folder.Projects[$PROJECT_NAME]
          if ($ExistingProject -ne $null) {
            Write-Host "Deleting existing project: $PROJECT_NAME (Partner)"
            $ExistingProject.Drop()
          }
          
          Write-Host "Deploying project: $PROJECT_NAME (Partner)"
          $Folder.DeployProject($PROJECT_NAME, $ProjectBytes)
          
          Write-Host "SSIS package deployed successfully (Partner)!"
          Write-Host "DEPLOYMENT_STATUS=success" >> $env:GITHUB_OUTPUT

      # --- STEP 5: VERIFY DEPLOYMENT ---
      - name: Verify SSIS Deployment (Partner)
        if: steps.deploy_ssis_partner.outputs.DEPLOYMENT_STATUS == 'success'
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          
          $ProjectExists = sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d SSISDB -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[projects] p INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id WHERE f.name = '$FOLDER_NAME' AND p.name = '$PROJECT_NAME'" -h-1
          $ProjectExists = $ProjectExists.Trim()
          
          if ($ProjectExists -eq "1") {
            Write-Host "SSIS deployment verified successfully (Partner)!"
          } else {
            Write-Error "SSIS project not found (Partner)!"
            exit 1
          }

      # --- STEP 6: CREATE AND RUN JOB ---
      - name: Create and Run Partner SQL Agent Job
        if: always()
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          if (Test-Path "scripts/create_job.sql") {
            Write-Host "Creating SQL Agent Job (Partner)..."
            sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d msdb -i "scripts/create_job.sql"
            
            Write-Host "Starting Partner SQL Agent Job..."
            sqlcmd -S "${env:SERVER},${env:PORT}" -U "${env:USERNAME}" -P "${env:PASSWORD}" -d msdb -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';"
          } else {
            Write-Host "create_job.sql not found, skipping job creation (Partner)."
          }