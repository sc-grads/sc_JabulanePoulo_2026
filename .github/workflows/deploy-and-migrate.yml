name: Pinggys SSIS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Stage: DevTest/Deploy (Matches the first node in your screenshot)
  DevTest_Deploy:
    name: DevTest/Deploy
    runs-on: ubuntu-latest
    environment: local-sql
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Deploy SQL Database to DevTest
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Deploying to DevTest..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -i "scripts/create_database.sql" \
            -C

      - name: Create & Start Migration Job
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Creating migration job..."
          /opt/mssql-tools18/bin/sqlcmd -S "${SERVER},${PORT}" -U "$USERNAME" -P "$PASSWORD" -d msdb -i "scripts/create_job.sql" -C
          
          echo "Starting migration job..."
          /opt/mssql-tools18/bin/sqlcmd -S "${SERVER},${PORT}" -U "$USERNAME" -P "$PASSWORD" -d msdb -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" -C

  # 2. Stage: Production/Deploy (Matches the second node in your screenshot)
  Production_Deploy:
    name: Production/Deploy
    runs-on: ubuntu-latest
    needs: DevTest_Deploy  # This creates the arrow/dependency from DevTest to Production
    environment: partner-sql  # Assuming "Production" uses your partner secrets
    if: success()            # Only run if DevTest succeeded
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Deploy SQL Database to Production
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "Deploying to Production..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -i "scripts/create_database_partner.sql" \
            -C

      - name: Create & Start Partner Migration Job
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "Creating partner migration job..."
          /opt/mssql-tools18/bin/sqlcmd -S "${SERVER},${PORT}" -U "$USERNAME" -P "$PASSWORD" -d msdb -i "scripts/create_job.sql" -C
          
          echo "Starting partner migration job..."
          /opt/mssql-tools18/bin/sqlcmd -S "${SERVER},${PORT}" -U "$USERNAME" -P "$PASSWORD" -d msdb -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" -C