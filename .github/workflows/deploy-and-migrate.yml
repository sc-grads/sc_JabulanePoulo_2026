name: Pinggys SSIS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Stage: DevTest/Deploy
  # ==========================================
  DevTest_Deploy:
    name: DevTest/Deploy
    runs-on: windows-latest  # Use Windows runner for Integrated Security
    environment: local-sql
    continue-on-error: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          sqlcmd -S "$env:SERVER,$env:PORT" -U "$env:USERNAME" -P "$env:PASSWORD" -d master -i "scripts/create_database.sql" -b
        shell: pwsh

      # --- STEP 2: DEPLOY SSIS PACKAGE (Using Windows Authentication) ---
      - name: Deploy SSIS Package to DevTest
        id: deploy_ssis
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          FOLDER_NAME: "TimesheetDevTestMigration"
          PROJECT_NAME: "TimesheetMigration1"
          PACKAGE_PATH: "ssis-packages/TimesheetMigration1.ispac"
        run: |
          # Check if package exists
          if (!(Test-Path $env:PACKAGE_PATH)) {
            Write-Host "Error: Package file not found!"
            Write-Host "Current directory contents:"
            Get-ChildItem
            exit 1
          }
          
          # Run deployment script with Windows Authentication
          .\scripts\Deploy-SSIS.ps1 `
            -ServerName $env:SERVER `
            -FolderName $env:FOLDER_NAME `
            -ProjectName $env:PROJECT_NAME `
            -PackagePath $env:PACKAGE_PATH
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "DEPLOYMENT_STATUS=success" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "DEPLOYMENT_STATUS=failed" >> $env:GITHUB_OUTPUT
            exit $LASTEXITCODE
          }
        shell: pwsh

      # --- STEP 3: VERIFY DEPLOYMENT ---
      - name: Verify SSIS Deployment
        if: steps.deploy_ssis.outputs.DEPLOYMENT_STATUS == 'success'
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
          PORT: ${{ secrets.SQL_PORT }}
        run: |
          $query = @"
          SELECT f.name as FolderName, p.name as ProjectName, pk.name as PackageName
          FROM [SSISDB].[catalog].[packages] pk
          INNER JOIN [SSISDB].[catalog].[projects] p ON pk.project_id = p.project_id
          INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
          WHERE f.name = 'TimesheetDevTestMigration' AND p.name = 'TimesheetMigration1'"@
          
          sqlcmd -S "$env:SERVER,$env:PORT" -U "$env:USERNAME" -P "$env:PASSWORD" -d SSISDB -Q $query
        shell: pwsh

      # --- STEP 4: CREATE AND RUN JOB ---
      - name: Create and Run DevTest SQL Agent Job
        if: always()
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          if (Test-Path "scripts/create_job.sql") {
            sqlcmd -S "$env:SERVER,$env:PORT" -U "$env:USERNAME" -P "$env:PASSWORD" -d msdb -i "scripts/create_job.sql" -b
          }
          
          # Start the job
          sqlcmd -S "$env:SERVER,$env:PORT" -U "$env:USERNAME" -P "$env:PASSWORD" -d msdb -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" -b
        shell: pwsh

  # ==========================================
  # 2. Stage: Production/Deploy
  # ==========================================
  Production_Deploy:
    name: Production/Deploy
    runs-on: windows-latest
    needs: DevTest_Deploy
    environment: partner-sql
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          sqlcmd -S "$env:SERVER,$env:PORT" -U "$env:USERNAME" -P "$env:PASSWORD" -d master -i "scripts/create_database.sql" -b
        shell: pwsh

      # --- STEP 2: DEPLOY SSIS PACKAGE (Using Windows Authentication) ---
      - name: Deploy SSIS Package to Partner
        id: deploy_ssis_partner
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          FOLDER_NAME: "TimesheetDevTestMigration"
          PROJECT_NAME: "TimesheetMigration1"
          PACKAGE_PATH: "ssis-packages/TimesheetMigration1.ispac"
        run: |
          if (!(Test-Path $env:PACKAGE_PATH)) {
            Write-Host "Error: Package file not found!"
            exit 1
          }
          
          .\scripts\Deploy-SSIS.ps1 `
            -ServerName $env:SERVER `
            -FolderName $env:FOLDER_NAME `
            -ProjectName $env:PROJECT_NAME `
            -PackagePath $env:PACKAGE_PATH
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "DEPLOYMENT_STATUS=success" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "DEPLOYMENT_STATUS=failed" >> $env:GITHUB_OUTPUT
            exit $LASTEXITCODE
          }
        shell: pwsh

      # --- STEP 3: VERIFY DEPLOYMENT ---
      - name: Verify SSIS Deployment (Partner)
        if: steps.deploy_ssis_partner.outputs.DEPLOYMENT_STATUS == 'success'
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          $query = @"
          SELECT f.name as FolderName, p.name as ProjectName, pk.name as PackageName
          FROM [SSISDB].[catalog].[packages] pk
          INNER JOIN [SSISDB].[catalog].[projects] p ON pk.project_id = p.project_id
          INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
          WHERE f.name = 'TimesheetDevTestMigration' AND p.name = 'TimesheetMigration1'"@
          sqlcmd -S "$env:SERVER,$env:PORT" -U "$env:USERNAME" -P "$env:PASSWORD" -d SSISDB -Q $query
        shell: pwsh

      # --- STEP 4: CREATE AND RUN JOB ---
      - name: Create and Run Partner SQL Agent Job
        if: always()
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          if (Test-Path "scripts/create_job.sql") {
            sqlcmd -S "$env:SERVER,$env:PORT" -U "$env:USERNAME" -P "$env:PASSWORD" -d msdb -i "scripts/create_job.sql" -b
          }
          
          sqlcmd -S "$env:SERVER,$env:PORT" -U "$env:USERNAME" -P "$env:PASSWORD" -d msdb -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" -b
        shell: pwsh