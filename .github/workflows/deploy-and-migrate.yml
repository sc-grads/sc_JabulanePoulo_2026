name: Deploy SSIS via Pinggy Tunnel

on:
  push:

jobs:
  deploy-local:
    name: DevTest/Deploy
    runs-on: windows-latest
    environment: local-sql

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      
    - name: Create Database and Tables
      shell: powershell
      run: |
        $scriptPath = "${{ github.workspace }}\scripts\create_database.sql"
        
        if (-not (Test-Path -Path $scriptPath)) {
          Write-Host "Primary path not found. Testing alternate path..."
          $scriptPath = "${{ github.workspace }}\..\scripts\create_database.sql"
          $scriptPath = [System.IO.Path]::GetFullPath($scriptPath)
        }

        if (-not (Test-Path -Path $scriptPath)) {
          Write-Error "CRITICAL ERROR: Could not locate create_database.sql file."
          exit 1
        }

        $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
        $dbUser        = "${{ secrets.SQL_USERNAME }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $initialDb     = "master"

        Write-Host "Reading database creation script..."
        $scriptContent = Get-Content -Path $scriptPath -Raw

        Write-Host "Establishing tunnel connection to create database..."

        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)

        try {
          $connection.Open()
          Write-Host "Connected to SQL Server successfully."
          
          $scriptParts = @()
          $currentBatch = ""
          
          foreach ($line in $scriptContent -split "`r`n|`n|`r") {
            $trimmedLine = $line.Trim()
            
            if ($trimmedLine -match "^(?i)GO\s*$") {
              if ($currentBatch.Trim() -ne "") {
                $scriptParts += $currentBatch
                $currentBatch = ""
              }
            } else {
              if ($currentBatch -ne "") {
                $currentBatch += "`r`n"
              }
              $currentBatch += $line
            }
          }
          
          if ($currentBatch.Trim() -ne "") {
            $scriptParts += $currentBatch
          }
          
          foreach ($part in $scriptParts) {
            $trimmedPart = $part.Trim()
            if ($trimmedPart -ne "") {
              Write-Host "Executing SQL block..."
              try {
                $command = $connection.CreateCommand()
                $command.CommandText = $trimmedPart
                $command.ExecuteNonQuery() | Out-Null
                Write-Host "SQL block executed successfully."
              } catch {
                Write-Host "Warning: Error executing SQL block: $_"
                Write-Host "SQL Block Content:"
                Write-Host $trimmedPart
              }
            }
          }

          Write-Host "SUCCESS: Database and tables created successfully!"

        } catch {
          Write-Error "Database Creation Failed: $_"
          exit 1
        } finally {
          $connection.Close()
        }

    - name: Deploy SSIS and Create Execution Job
      shell: powershell
      run: |
        $ispacPath = "${{ github.workspace }}\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"
 
        if (-not (Test-Path -Path $ispacPath)) {
          Write-Host "Primary path not found. Testing alternate path..."
          $ispacPath = "${{ github.workspace }}\..\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac" 
          $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
 
        if (-not (Test-Path -Path $ispacPath)) {
          Write-Error "CRITICAL ERROR: Could not locate TimesheetMigration1.ispac file."
          exit 1
        }

        $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
        $dbUser        = "${{ secrets.SQL_USERNAME }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $initialDb     = "master"
        $targetFolder  = "TimesheetDevTestMigration"
        $projectName   = "TimesheetMigration1"
        $executionJobName = "RunTimesheetDevTestMigrationPK"
        
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
        
        Write-Host "Establishing local tunnel connection..."
 
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=SSISDB;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
 
        try {
          $connection.Open()
          
          # Build the SQL query using a single-quoted string to avoid PowerShell expansion issues
          $sqlQuery = '
            SET NOCOUNT ON;
            USE [msdb];
 
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N' + "'GitHub_SSIS_Deploy_Job'" + ')
            BEGIN
              EXEC dbo.sp_delete_job @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ', @delete_unused_schedule=1;
            END
 
            EXEC dbo.sp_add_job 
              @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ', 
              @enabled = 1, 
              @start_step_id = 1;
 
            DECLARE @deploy_script NVARCHAR(MAX);
            SET @deploy_script = N' + "'" + '
              USE [SSISDB]; 
              IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ' + "'" + "'" + '$targetFolder' + "'" + "'" + ') 
              BEGIN 
                EXEC [catalog].[create_folder] @folder_name = N' + "'" + "'" + '$targetFolder' + "'" + "'" + '; 
              END 
              DECLARE @project_stream VARBINARY(MAX) = $hexString; 
              EXEC [catalog].[deploy_project] 
                @folder_name = N' + "'" + "'" + '$targetFolder' + "'" + "'" + ', 
                @project_name = N' + "'" + "'" + '$projectName' + "'" + "'" + ', 
                @project_stream = @project_stream; 
            ' + "'" + ';
              
            EXEC dbo.sp_add_jobstep 
              @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ', 
              @step_name = N' + "'Run Deploy'" + ', 
              @subsystem = N' + "'TSQL'" + ', 
              @command = @deploy_script, 
              @retry_attempts = 0;
              
            EXEC dbo.sp_add_jobserver 
              @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ', 
              @server_name = N' + "'(local)'" + ';
              
            DECLARE @deploy_job_id UNIQUEIDENTIFIER;
            SELECT @deploy_job_id = job_id FROM msdb.dbo.sysjobs WHERE name = N' + "'GitHub_SSIS_Deploy_Job'" + ';
            EXEC dbo.sp_start_job @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ';
 
            WHILE EXISTS (
              SELECT 1 FROM msdb.dbo.sysjobactivity
              WHERE job_id = @deploy_job_id AND start_execution_date IS NOT NULL AND stop_execution_date IS NULL
            )
            BEGIN
              WAITFOR DELAY ' + "'00:00:02'" + ';
            END
 
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N' + "'$executionJobName'" + ')
            BEGIN
              EXEC dbo.sp_delete_job @job_name = N' + "'$executionJobName'" + ', @delete_unused_schedule=1;
            END
 
            EXEC dbo.sp_add_job 
              @job_name = N' + "'$executionJobName'" + ', 
              @enabled = 1, 
              @description = N' + "'Automated execution tracking for $projectName.'" + ', 
              @start_step_id = 1;
              
            DECLARE @TargetServer NVARCHAR(128) = CAST(SERVERPROPERTY(' + "'ServerName'" + ') AS NVARCHAR(128));
            DECLARE @run_command NVARCHAR(MAX);
            SET @run_command = N' + "'/ISSERVER '" + ' + CHAR(34) + N' + "'\SSISDB\$targetFolder\$projectName\TimesheetMigration.dtsx'" + ' + CHAR(34) + N' + "' /SERVER '" + ' + CHAR(34) + @TargetServer + CHAR(34) + N' + "' /Par '" + ' + CHAR(34) + N' + "'$ServerOption::LOGGING_LEVEL(Int16)'" + ' + CHAR(34) + N' + "';1 /CALLERINFO SQLAGENT /REPORTING E'" + ';
              
            EXEC dbo.sp_add_jobstep 
              @job_name = N' + "'$executionJobName'" + ', 
              @step_name = N' + "'Execute SSIS Package'" + ', 
              @subsystem = N' + "'SSIS'" + ', 
              @command = @run_command, 
              @retry_attempts = 0;
              
            EXEC dbo.sp_add_jobserver 
              @job_name = N' + "'$executionJobName'" + ', 
              @server_name = N' + "'(local)'" + ';
              
            EXEC dbo.sp_add_jobschedule
              @job_name = N' + "'$executionJobName'" + ',
              @name = N' + "'Every_1_Minute_8AM_to_5PM'" + ',
              @enabled = 1,
              @freq_type = 4,
              @freq_interval = 1,
              @freq_subday_type = 4,
              @freq_subday_interval = 1,
              @active_start_time = 080000,
              @active_end_time = 170000;
 
            EXEC dbo.sp_start_job @job_name = N' + "'$executionJobName'" + ';
            WAITFOR DELAY ' + "'00:00:05'" + ';
          '
          
          # Replace placeholders
          $sqlQuery = $sqlQuery.Replace('$targetFolder', $targetFolder)
          $sqlQuery = $sqlQuery.Replace('$projectName', $projectName)
          $sqlQuery = $sqlQuery.Replace('$executionJobName', $executionJobName)
          $sqlQuery = $sqlQuery.Replace('$hexString', $hexString)
          
          # Write the SQL to a temp file for debugging
          $sqlQuery | Out-File -FilePath "D:\a\deploy.sql" -Encoding ASCII
          
          $command = $connection.CreateCommand()
          $command.CommandText = $sqlQuery
          $command.ExecuteNonQuery() | Out-Null
 
          Write-Host "SUCCESS: Local SSIS Project deployed, job triggered, and execution delay finalized!"
 
        } catch {
          Write-Error "Local Deployment Failed: $_"
          exit 1
        } finally {
          $connection.Close()
        }

  deploy-partner:
    name: Production/Deploy
    runs-on: windows-latest
    needs: deploy-local
    environment: partner-sql

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Create Database and Tables on Partner Server
      shell: powershell
      run: |
        $scriptPath = "${{ github.workspace }}\scripts\create_database.sql"
        
        if (-not (Test-Path -Path $scriptPath)) {
          Write-Host "Primary path not found. Testing alternate path..."
          $scriptPath = "${{ github.workspace }}\..\scripts\create_database.sql"
          $scriptPath = [System.IO.Path]::GetFullPath($scriptPath)
        }

        if (-not (Test-Path -Path $scriptPath)) {
          Write-Error "CRITICAL ERROR: Could not locate create_database.sql file."
          exit 1
        }

        $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
        $dbUser        = "${{ secrets.SQL_USERNAME }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $initialDb     = "master"

        Write-Host "Reading database creation script for partner server..."
        $scriptContent = Get-Content -Path $scriptPath -Raw

        Write-Host "Establishing tunnel connection to partner server to create database..."

        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)

        try {
          $connection.Open()
          Write-Host "Connected to partner SQL Server successfully."
          
          $scriptParts = @()
          $currentBatch = ""
          
          foreach ($line in $scriptContent -split "`r`n|`n|`r") {
            $trimmedLine = $line.Trim()
            
            if ($trimmedLine -match "^(?i)GO\s*$") {
              if ($currentBatch.Trim() -ne "") {
                $scriptParts += $currentBatch
                $currentBatch = ""
              }
            } else {
              if ($currentBatch -ne "") {
                $currentBatch += "`r`n"
              }
              $currentBatch += $line
            }
          }
          
          if ($currentBatch.Trim() -ne "") {
            $scriptParts += $currentBatch
          }
          
          foreach ($part in $scriptParts) {
            $trimmedPart = $part.Trim()
            if ($trimmedPart -ne "") {
              Write-Host "Executing SQL block on partner server..."
              try {
                $command = $connection.CreateCommand()
                $command.CommandText = $trimmedPart
                $command.ExecuteNonQuery() | Out-Null
                Write-Host "SQL block executed successfully on partner server."
              } catch {
                Write-Host "Warning: Error executing SQL block on partner server: $_"
                Write-Host "SQL Block Content:"
                Write-Host $trimmedPart
              }
            }
          }

          Write-Host "SUCCESS: Database and tables created successfully on partner server!"

        } catch {
          Write-Error "Database Creation Failed on partner server: $_"
          exit 1
        } finally {
          $connection.Close()
        }
 
    - name: Deploy SSIS and Create Execution Job (Partner)
      shell: powershell
      run: |
        $ispacPath = "${{ github.workspace }}\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"
 
        if (-not (Test-Path -Path $ispacPath)) {
          Write-Host "Primary path not found. Testing alternate path..."
          $ispacPath = "${{ github.workspace }}\..\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac" 
          $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
 
        if (-not (Test-Path -Path $ispacPath)) {
          Write-Error "CRITICAL ERROR: Could not locate TimesheetMigration1.ispac file."
          exit 1
        }
 
        $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
        $dbUser        = "${{ secrets.SQL_USERNAME }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $initialDb     = "master"
        $targetFolder  = "TimesheetProductionMigration"
        $projectName   = "TimesheetMigration1"
        $executionJobName = "RunTimesheetProductionMigrationPK"
        $partnerServer = "DESKTOP-DBA1BPB\SQLSERVER2025"
 
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
 
        Write-Host "Establishing tunnel connection to partner environment..."
 
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
 
        try {
          $connection.Open()
 
          # Build the SQL query using a single-quoted string to avoid PowerShell expansion issues
          $sqlQuery = '
            SET NOCOUNT ON;
            USE [msdb];
 
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N' + "'GitHub_SSIS_Deploy_Job'" + ')
            BEGIN
              EXEC dbo.sp_delete_job @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ', @delete_unused_schedule=1;
            END
 
            EXEC dbo.sp_add_job 
              @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ', 
              @enabled = 1, 
              @start_step_id = 1;
 
            DECLARE @deploy_script NVARCHAR(MAX);
            SET @deploy_script = N' + "'" + '
              USE [SSISDB];
              IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ' + "'" + "'" + '$targetFolder' + "'" + "'" + ')
              BEGIN
                EXEC [catalog].[create_folder] @folder_name = N' + "'" + "'" + '$targetFolder' + "'" + "'" + ';
              END
              DECLARE @project_stream VARBINARY(MAX) = $hexString;
              EXEC [catalog].[deploy_project] 
                @folder_name = N' + "'" + "'" + '$targetFolder' + "'" + "'" + ', 
                @project_name = N' + "'" + "'" + '$projectName' + "'" + "'" + ', 
                @project_stream = @project_stream;
 
              EXEC SSISDB.catalog.set_object_parameter_value
                @object_type = 30,
                @folder_name = N' + "'" + "'" + '$targetFolder' + "'" + "'" + ',
                @project_name = N' + "'" + "'" + '$projectName' + "'" + "'" + ',
                @object_name = N' + "'TimesheetMigration.dtsx'" + ',
                @parameter_name = N' + "'CM.LAPTOP-7LSAQSR0.master1.ServerName'" + ',
                @parameter_value = N' + "'$partnerServer'" + ';
 
              EXEC SSISDB.catalog.set_object_parameter_value
                @object_type = 30,
                @folder_name = N' + "'" + "'" + '$targetFolder' + "'" + "'" + ',
                @project_name = N' + "'" + "'" + '$projectName' + "'" + "'" + ',
                @object_name = N' + "'TimesheetMigration.dtsx'" + ',
                @parameter_name = N' + "'CM.LAPTOP-7LSAQSR0.master1.InitialCatalog'" + ',
                @parameter_value = N' + "'TimesheetsDB'" + ';
            ' + "'" + ';
              
            EXEC dbo.sp_add_jobstep 
              @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ', 
              @step_name = N' + "'Run Deploy'" + ', 
              @subsystem = N' + "'TSQL'" + ', 
              @command = @deploy_script, 
              @retry_attempts = 0;
              
            EXEC dbo.sp_add_jobserver 
              @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ', 
              @server_name = N' + "'(local)'" + ';
              
            DECLARE @deploy_job_id UNIQUEIDENTIFIER;
            SELECT @deploy_job_id = job_id FROM msdb.dbo.sysjobs WHERE name = N' + "'GitHub_SSIS_Deploy_Job'" + ';
            EXEC dbo.sp_start_job @job_name = N' + "'GitHub_SSIS_Deploy_Job'" + ';
 
            WHILE EXISTS (
              SELECT 1 FROM msdb.dbo.sysjobactivity
              WHERE job_id = @deploy_job_id AND start_execution_date IS NOT NULL AND stop_execution_date IS NULL
            )
            BEGIN
              WAITFOR DELAY ' + "'00:00:02'" + ';
            END
 
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N' + "'$executionJobName'" + ')
            BEGIN
              EXEC dbo.sp_delete_job @job_name = N' + "'$executionJobName'" + ', @delete_unused_schedule=1;
            END
 
            EXEC dbo.sp_add_job 
              @job_name = N' + "'$executionJobName'" + ', 
              @enabled = 1, 
              @description = N' + "'Automated execution tracking for $projectName.'" + ', 
              @start_step_id = 1;
 
            DECLARE @TargetServer NVARCHAR(128) = CAST(SERVERPROPERTY(' + "'ServerName'" + ') AS NVARCHAR(128));
            DECLARE @run_command NVARCHAR(MAX);
            SET @run_command = N' + "'/ISSERVER '" + ' + CHAR(34) + N' + "'\SSISDB\$targetFolder\$projectName\TimesheetMigration.dtsx'" + ' + CHAR(34) + N' + "' /SERVER '" + ' + CHAR(34) + @TargetServer + CHAR(34) + N' + "' /Par '" + ' + CHAR(34) + N' + "'$ServerOption::LOGGING_LEVEL(Int16)'" + ' + CHAR(34) + N' + "';1 /CALLERINFO SQLAGENT /REPORTING E'" + ';
 
            EXEC dbo.sp_add_jobstep 
              @job_name = N' + "'$executionJobName'" + ', 
              @step_name = N' + "'Execute SSIS Package'" + ', 
              @subsystem = N' + "'SSIS'" + ', 
              @command = @run_command, 
              @retry_attempts = 0;
              
            EXEC dbo.sp_add_jobserver 
              @job_name = N' + "'$executionJobName'" + ', 
              @server_name = N' + "'(local)'" + ';
              
            EXEC dbo.sp_add_jobschedule
              @job_name = N' + "'$executionJobName'" + ',
              @name = N' + "'Every_1_Minute_8AM_to_5PM'" + ',
              @enabled = 1,
              @freq_type = 4,
              @freq_interval = 1,
              @freq_subday_type = 4,
              @freq_subday_interval = 1,
              @active_start_time = 080000,
              @active_end_time = 170000;
 
            EXEC dbo.sp_start_job @job_name = N' + "'$executionJobName'" + ';
            WAITFOR DELAY ' + "'00:00:05'" + ';
          '
 
          # Replace placeholders
          $sqlQuery = $sqlQuery.Replace('$targetFolder', $targetFolder)
          $sqlQuery = $sqlQuery.Replace('$projectName', $projectName)
          $sqlQuery = $sqlQuery.Replace('$executionJobName', $executionJobName)
          $sqlQuery = $sqlQuery.Replace('$partnerServer', $partnerServer)
          $sqlQuery = $sqlQuery.Replace('$hexString', $hexString)
          
          # Write the SQL to a temp file for debugging
          $sqlQuery | Out-File -FilePath "D:\a\deploy_partner.sql" -Encoding ASCII
 
          $command = $connection.CreateCommand()
          $command.CommandText = $sqlQuery
          $command.ExecuteNonQuery() | Out-Null
 
          Write-Host "SUCCESS: Partner deployment completed, configuration overrides applied, and task triggered!"
 
        } catch {
          Write-Error "Partner Execution Failed: $_"
          exit 1
        } finally {
          $connection.Close()
        }