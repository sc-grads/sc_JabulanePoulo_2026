name: Pinggys SSIS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Stage: DevTest/Deploy
  # ==========================================
  DevTest_Deploy:
    name: DevTest/Deploy
    runs-on: ubuntu-latest
    environment: local-sql
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Deploying TimesheetsDB to DevTest..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -i "scripts/create_database.sql" \
            -b \
            -C
          echo "✅ Database deployment completed."

      # --- STEP 2: SSIS CATALOG ---
      - name: Initialize SSIS Catalog (SSISDB) if Missing
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Checking if SSISDB exists..."
          
          SSISDB_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$SSISDB_EXISTS" == "0" ]; then
            echo "Creating SSISDB..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d master \
              -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '${{ secrets.SQL_PASSWORD }}';" \
              -C
            echo "✅ SSISDB created successfully."
          else
            echo "✅ SSISDB already exists."
          fi

      # --- STEP 3: CREATE SSIS FOLDER ---
      - name: Create SSIS Folder
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          FOLDER_NAME="TimesheetDevTestMigration"
          echo "Verifying SSIS folder: $FOLDER_NAME"
          
          FOLDER_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name='$FOLDER_NAME'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$FOLDER_EXISTS" == "0" ]; then
            echo "Folder '$FOLDER_NAME' not found. Creating..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d SSISDB \
              -Q "EXEC [SSISDB].[catalog].[create_folder] @folder_name=N'$FOLDER_NAME', @folder_id=0;" \
              -C
            echo "✅ Folder '$FOLDER_NAME' created successfully."
          else
            echo "✅ Folder '$FOLDER_NAME' already exists."
          fi

      # --- STEP 4: DEPLOY SSIS PACKAGE (FIXED) ---
      - name: Deploy SSIS Package (.ispac) to DevTest
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          PACKAGE_PATH="ssis-packages/TimesheetMigration1.ispac"
          FOLDER_NAME="TimesheetDevTestMigration"
          PROJECT_NAME="TimesheetMigration1"
          
          echo "Checking for package at: $PACKAGE_PATH"
          
          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "❌ Error: Package file $PACKAGE_PATH not found!"
            echo "Current directory contents:"
            ls -la
            echo ""
            echo "Checking for ssis-packages directory:"
            ls -la ssis-packages/ 2>/dev/null || echo "ssis-packages directory not found"
            exit 1
          fi
          
          echo "Encoding package to Base64..."
          PACKAGE_BASE64=$(base64 -w 0 "$PACKAGE_PATH")
          
          echo "Deploying Project to folder: $FOLDER_NAME"
          
          # Create temporary SQL file with deployment command - FIXED SYNTAX
          cat > /tmp/deploy_ssis.sql << EOF
          SET QUOTED_IDENTIFIER ON;
          SET ANSI_NULLS ON;
          
          DECLARE @project_binary varbinary(max);
          DECLARE @base64 varchar(max) = '${PACKAGE_BASE64}';
          
          SET @project_binary = CAST(N'' AS XML).value('xs:base64Binary(sql:variable("@base64"))', 'varbinary(max)');
          
          EXEC [SSISDB].[catalog].[deploy_project] 
            @folder_name = '${FOLDER_NAME}',
            @project_name = '${PROJECT_NAME}',
            @project_stream = @project_binary;
          EOF
          
          # Execute the deployment
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -i /tmp/deploy_ssis.sql \
            -C
          
          # Clean up
          rm -f /tmp/deploy_ssis.sql
          
          echo "✅ SSIS package deployed to: \SSISDB\$FOLDER_NAME\$PROJECT_NAME\"

      # --- STEP 5: VERIFY DEPLOYMENT ---
      - name: Verify SSIS Deployment
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Verifying SSIS deployment..."
          
          FOLDER_NAME="TimesheetDevTestMigration"
          PROJECT_NAME="TimesheetMigration1"
          
          PROJECT_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -Q "SET NOCOUNT ON; 
                SELECT COUNT(*) 
                FROM [SSISDB].[catalog].[projects] p
                INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                WHERE f.name = '$FOLDER_NAME' 
                  AND p.name = '$PROJECT_NAME'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$PROJECT_EXISTS" -eq "1" ]; then
            echo "✅ SSIS deployment verified successfully!"
            
            echo ""
            echo "📦 Packages in project:"
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d SSISDB \
              -Q "SET NOCOUNT ON; 
                  SELECT f.name as FolderName, p.name as ProjectName, pk.name as PackageName
                  FROM [SSISDB].[catalog].[packages] pk
                  INNER JOIN [SSISDB].[catalog].[projects] p ON pk.project_id = p.project_id
                  INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                  WHERE f.name = '$FOLDER_NAME' AND p.name = '$PROJECT_NAME'" \
              -C
          else
            echo "❌ SSIS project not found in SSISDB."
            exit 1
          fi

      # --- STEP 6: CREATE JOB ---
      - name: Create DevTest SQL Agent Job
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          if [ -f "scripts/create_job.sql" ]; then
            echo "Creating SQL Agent Job..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d msdb \
              -i "scripts/create_job.sql" \
              -C
            echo "✅ Job created successfully."
          else
            echo "⚠️ create_job.sql not found, skipping job creation."
          fi

      # --- STEP 7: RUN THE JOB ---
      - name: Run DevTest Migration Job
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Starting SQL Agent Job..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d msdb \
            -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" \
            -C || echo "⚠️ Job may not exist or SQL Agent is not running"
          echo "✅ Job started."

  # ==========================================
  # 2. Stage: Production/Deploy
  # ==========================================
  Production_Deploy:
    name: Production/Deploy
    runs-on: ubuntu-latest
    needs: DevTest_Deploy
    environment: partner-sql
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "Deploying TimesheetsDB to Production (Partner)..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -i "scripts/create_database.sql" \
            -b \
            -C

      # --- STEP 2: SSIS CATALOG ---
      - name: Initialize SSIS Catalog (SSISDB) if Missing (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          SSISDB_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$SSISDB_EXISTS" == "0" ]; then
            echo "Creating SSISDB (Partner)..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d master \
              -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '${{ secrets.PARTNER_SQL_PASSWORD }}';" \
              -C
          fi

      # --- STEP 3: CREATE SSIS FOLDER ---
      - name: Create SSIS Folder (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          FOLDER_NAME="TimesheetDevTestMigration"
          FOLDER_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name='$FOLDER_NAME'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$FOLDER_EXISTS" == "0" ]; then
            echo "Creating SSIS folder '$FOLDER_NAME' (Partner)..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d SSISDB \
              -Q "EXEC [SSISDB].[catalog].[create_folder] @folder_name=N'$FOLDER_NAME', @folder_id=0;" \
              -C
          else
            echo "Folder '$FOLDER_NAME' already exists (Partner)."
          fi

      # --- STEP 4: DEPLOY SSIS PACKAGE (FIXED) ---
      - name: Deploy SSIS Package (.ispac) to Partner
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          PACKAGE_PATH="ssis-packages/TimesheetMigration1.ispac"
          FOLDER_NAME="TimesheetDevTestMigration"
          PROJECT_NAME="TimesheetMigration1"
          
          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "❌ Error: Package file $PACKAGE_PATH not found!"
            exit 1
          fi
          
          echo "Encoding package to Base64..."
          PACKAGE_BASE64=$(base64 -w 0 "$PACKAGE_PATH")
          
          echo "Deploying Project to folder: $FOLDER_NAME"
          
          # Create temporary SQL file with deployment command - FIXED SYNTAX
          cat > /tmp/deploy_ssis.sql << EOF
          SET QUOTED_IDENTIFIER ON;
          SET ANSI_NULLS ON;
          
          DECLARE @project_binary varbinary(max);
          DECLARE @base64 varchar(max) = '${PACKAGE_BASE64}';
          
          SET @project_binary = CAST(N'' AS XML).value('xs:base64Binary(sql:variable("@base64"))', 'varbinary(max)');
          
          EXEC [SSISDB].[catalog].[deploy_project] 
            @folder_name = '${FOLDER_NAME}',
            @project_name = '${PROJECT_NAME}',
            @project_stream = @project_binary;
          EOF
          
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -i /tmp/deploy_ssis.sql \
            -C
          
          rm -f /tmp/deploy_ssis.sql

      # --- STEP 5: CREATE JOB ---
      - name: Create Partner SQL Agent Job
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          if [ -f "scripts/create_job.sql" ]; then
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d msdb \
              -i "scripts/create_job.sql" \
              -C
          fi

      # --- STEP 6: RUN THE JOB ---
      - name: Run Partner Migration Job
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "Starting Partner SQL Agent Job..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d msdb \
            -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" \
            -C || echo "⚠️ Job may not exist or SQL Agent is not running"