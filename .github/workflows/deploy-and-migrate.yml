name: Deploy Database and Run Migration
run-name: "${{ github.event_name == 'push' && format('Deploy {0} - {1}', github.ref_name, github.sha) || 'Manual Deployment' }}"

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  # Deploy to DevTest Environment with SSIS
  DevTest:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: local-sql
      sql-script-path: scripts/create_database.sql
      deploy-ssis: true
      ssis-package-path: ssis-packages/TimesheetMigration1.ispac
      ssis-folder-name: ETL
      ssis-project-name: TimesheetMigration1
    secrets: inherit

  # Deploy to Partner Environment with SSIS
  Partner:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: partner-sql
      sql-script-path: scripts/create_database_partner.sql
      deploy-ssis: true
      ssis-package-path: ssis-packages/TimesheetMigration1.ispac
      ssis-folder-name: ETL
      ssis-project-name: TimesheetMigration1
    secrets: inherit

  # Run TimesheetMigration Job after DevTest deployment
  RunMigrationJob:
    needs: DevTest
    runs-on: ubuntu-latest
    environment: local-sql
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Create Migration Job
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Creating TimesheetMigration job if it doesn't exist..."
          
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "msdb" \
            -Q "
              IF NOT EXISTS (SELECT 1 FROM sysjobs WHERE name = 'TimesheetMigration1')
              BEGIN
                DECLARE @jobId BINARY(16);
                
                EXEC msdb.dbo.sp_add_job 
                  @job_name = N'TimesheetMigration',
                  @enabled = 1,
                  @notify_level_eventlog = 0,
                  @notify_level_email = 0,
                  @notify_level_netsend = 0,
                  @notify_level_page = 0,
                  @delete_level = 0,
                  @description = N'Timesheet Migration SSIS Package',
                  @category_name = N'[Uncategorized (Local)]',
                  @owner_login_name = N'sa',
                  @job_id = @jobId OUTPUT;
                
                EXEC msdb.dbo.sp_add_jobstep 
                  @job_name = N'TimesheetMigration',
                  @step_name = N'Run SSIS Package',
                  @step_id = 1,
                  @cmdexec_success_code = 0,
                  @on_success_action = 1,
                  @on_success_step_id = 0,
                  @on_fail_action = 2,
                  @on_fail_step_id = 0,
                  @retry_attempts = 0,
                  @retry_interval = 0,
                  @os_run_priority = 0,
                  @subsystem = N'SSIS',
                  @command = N'/ISSERVER "\"\SSISDB\ETL\TimesheetMigration1\TimesheetMigration1.dtsx\"" /SERVER "\"\"localhost\"\"" /Par "\"\"$ServerOption::LOGGING_LEVEL(Int16)\"\"\";1 /Par "\"\"$ServerOption::SYNCHRONIZED(Boolean)\"\"\";True /CALLERINFO SQLAGENT /REPORTING E',
                  @database_name = N'master',
                  @flags = 0;
                
                EXEC msdb.dbo.sp_add_jobserver 
                  @job_name = N'TimesheetMigration',
                  @server_name = N'(local)';
                
                PRINT 'Job created successfully';
              END
              ELSE
              BEGIN
                PRINT 'Job already exists';
              END
            " \
            -C

      - name: Start and Monitor TimesheetMigration Job
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Starting TimesheetMigration job..."
          
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "msdb" \
            -Q "EXEC dbo.sp_start_job N'TimesheetMigration';" \
            -C
          
          echo "Waiting for job completion..."
          
          MAX_WAIT=300
          WAIT_INTERVAL=10
          ELAPSED=0
          JOB_COMPLETED=false
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
            
            RESULT=$(/opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d "msdb" \
              -Q "SET NOCOUNT ON; 
                  SELECT TOP 1 run_status 
                  FROM sysjobhistory h 
                  JOIN sysjobs j ON h.job_id = j.job_id 
                  WHERE j.name = 'TimesheetMigration' 
                  ORDER BY h.instance_id DESC" \
              -h-1 \
              -C | tr -d '[:space:]')
            
            case $RESULT in
              1)
                echo "Job completed successfully!"
                JOB_COMPLETED=true
                break
                ;;
              0)
                echo "Job failed!"
                /opt/mssql-tools18/bin/sqlcmd \
                  -S "${SERVER},${PORT}" \
                  -U "$USERNAME" \
                  -P "$PASSWORD" \
                  -d "msdb" \
                  -Q "SET NOCOUNT ON; 
                      SELECT TOP 3 
                        CONVERT(VARCHAR(20), run_date) as Date,
                        CONVERT(VARCHAR(8), run_time) as Time,
                        message 
                      FROM sysjobhistory h 
                      JOIN sysjobs j ON h.job_id = j.job_id 
                      WHERE j.name = 'TimesheetMigration' 
                        AND run_status = 0 
                      ORDER BY h.instance_id DESC" \
                  -h-1 \
                  -C
                exit 1
                ;;
              3)
                echo "Job was cancelled!"
                exit 1
                ;;
              *)
                echo "Job status: $RESULT - Still running or unknown"
                ;;
            esac
          done
          
          if [ "$JOB_COMPLETED" != "true" ]; then
            echo "Job did not complete within timeout"
            exit 1
          fi

      - name: Verify Migration Results
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Verifying migration results..."
          
          TIMESHEET_COUNT=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "TimesheetsDB" \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM timesheet.Timesheet" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          echo "Timesheet records: $TIMESHEET_COUNT"
          
          if [ "$TIMESHEET_COUNT" -gt "0" ]; then
            echo "Migration verified successfully!"
          else
            echo "Warning: No records found in timesheet.Timesheet"
          fi

  # Run Partner TimesheetMigration Job after Partner deployment
  RunPartnerMigrationJob:
    needs: Partner
    runs-on: ubuntu-latest
    environment: partner-sql
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Create Partner Migration Job
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "Creating Partner TimesheetMigration job if it doesn't exist..."
          
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "msdb" \
            -Q "
              IF NOT EXISTS (SELECT 1 FROM sysjobs WHERE name = 'TimesheetMigration')
              BEGIN
                DECLARE @jobId BINARY(16);
                
                EXEC msdb.dbo.sp_add_job 
                  @job_name = N'TimesheetMigration',
                  @enabled = 1,
                  @notify_level_eventlog = 0,
                  @notify_level_email = 0,
                  @notify_level_netsend = 0,
                  @notify_level_page = 0,
                  @delete_level = 0,
                  @description = N'Timesheet Migration SSIS Package',
                  @category_name = N'[Uncategorized (Local)]',
                  @owner_login_name = N'sa',
                  @job_id = @jobId OUTPUT;
                
                EXEC msdb.dbo.sp_add_jobstep 
                  @job_name = N'TimesheetMigration',
                  @step_name = N'Run SSIS Package',
                  @step_id = 1,
                  @cmdexec_success_code = 0,
                  @on_success_action = 1,
                  @on_success_step_id = 0,
                  @on_fail_action = 2,
                  @on_fail_step_id = 0,
                  @retry_attempts = 0,
                  @retry_interval = 0,
                  @os_run_priority = 0,
                  @subsystem = N'SSIS',
                  @command = N'/ISSERVER "\"\SSISDB\ETL\TimesheetMigration1\TimesheetMigration1.dtsx\"" /SERVER "\"\"localhost\"\"" /Par "\"\"$ServerOption::LOGGING_LEVEL(Int16)\"\"\";1 /Par "\"\"$ServerOption::SYNCHRONIZED(Boolean)\"\"\";True /CALLERINFO SQLAGENT /REPORTING E',
                  @database_name = N'master',
                  @flags = 0;
                
                EXEC msdb.dbo.sp_add_jobserver 
                  @job_name = N'TimesheetMigration',
                  @server_name = N'(local)';
                
                PRINT 'Partner job created successfully';
              END
              ELSE
              BEGIN
                PRINT 'Partner job already exists';
              END
            " \
            -C

      - name: Start and Monitor Partner TimesheetMigration Job
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "Starting Partner TimesheetMigration job..."
          
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "msdb" \
            -Q "EXEC dbo.sp_start_job N'TimesheetMigration';" \
            -C
          
          echo "Waiting for partner job completion..."
          
          MAX_WAIT=300
          WAIT_INTERVAL=10
          ELAPSED=0
          JOB_COMPLETED=false
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
            
            RESULT=$(/opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d "msdb" \
              -Q "SET NOCOUNT ON; 
                  SELECT TOP 1 run_status 
                  FROM sysjobhistory h 
                  JOIN sysjobs j ON h.job_id = j.job_id 
                  WHERE j.name = 'TimesheetMigration' 
                  ORDER BY h.instance_id DESC" \
              -h-1 \
              -C | tr -d '[:space:]')
            
            case $RESULT in
              1)
                echo "Partner job completed successfully!"
                JOB_COMPLETED=true
                break
                ;;
              0)
                echo "Partner job failed!"
                exit 1
                ;;
              3)
                echo "Partner job was cancelled!"
                exit 1
                ;;
              *)
                echo "Partner job status: $RESULT - Still running or unknown"
                ;;
            esac
          done
          
          if [ "$JOB_COMPLETED" != "true" ]; then
            echo "Partner job did not complete within timeout"
            exit 1
          fi