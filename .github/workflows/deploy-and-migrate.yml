name: Deploy SSIS via Pinggy Tunnel

on:
  push:
    branches:
      - main

jobs:

  # =========================================================================
  # JOB 1: DEPLOY TO LOCAL LAPTOP
  # =========================================================================
  deploy-local:
    name: Tunnel Deployment to Local Laptop
    runs-on: windows-latest
    environment: local-sql

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

     

      - name: Create Database and Tables
        shell: powershell
        run: |
          # STEP 1: LOCATE THE DATABASE SCRIPT
          $scriptPath = "${{ github.workspace }}\scripts\create_database.sql"
          
          if (-not (Test-Path -Path $scriptPath)) {
              Write-Host "Primary path not found. Testing alternate path..."
              $scriptPath = "${{ github.workspace }}\..\scripts\create_database.sql"
              $scriptPath = [System.IO.Path]::GetFullPath($scriptPath)
          }

          if (-not (Test-Path -Path $scriptPath)) {
              Write-Error "CRITICAL ERROR: Could not locate create_database.sql file."
              exit 1
          }

          # STEP 2: DEFINE TARGET CONFIGURATIONS FROM YOUR ENVIRONMENT
          $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
          $dbUser        = "${{ secrets.SQL_USERNAME }}"
          $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
          $initialDb     = "master"

          # STEP 3: READ THE SCRIPT FILE
          Write-Host "Reading database creation script..."
          $scriptContent = Get-Content -Path $scriptPath -Raw

          # STEP 4: EXECUTE THE DATABASE SCRIPT
          Write-Host "Establishing tunnel connection to create database..."

          $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
          $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)

          try {
              $connection.Open()
              
              # Split the script by GO statements
              $scriptParts = @()
              $currentBatch = ""
              
              foreach ($line in $scriptContent -split "`r`n|`n|`r") {
                  $trimmedLine = $line.Trim()
                  
                  if ($trimmedLine -match "^(?i)GO\s*$") {
                      if ($currentBatch.Trim() -ne "") {
                          $scriptParts += $currentBatch
                          $currentBatch = ""
                      }
                  } else {
                      if ($currentBatch -ne "") {
                          $currentBatch += "`r`n"
                      }
                      $currentBatch += $line
                  }
              }
              
              if ($currentBatch.Trim() -ne "") {
                  $scriptParts += $currentBatch
              }
              
              foreach ($part in $scriptParts) {
                  $trimmedPart = $part.Trim()
                  if ($trimmedPart -ne "") {
                      Write-Host "Executing SQL block..."
                      try {
                          $command = $connection.CreateCommand()
                          $command.CommandText = $trimmedPart
                          $command.ExecuteNonQuery() | Out-Null
                          Write-Host "SQL block executed successfully."
                      } catch {
                          Write-Host "Warning: Error executing SQL block: $_"
                          Write-Host "SQL Block Content:"
                          Write-Host $trimmedPart
                      }
                  }
              }

              Write-Host "SUCCESS: Database and tables created successfully!"

          } catch {
              Write-Error "Database Creation Failed: $_"
              exit 1
          } finally {
              $connection.Close()
          }

      - name: Deploy SSIS and Create Execution Job
        shell: powershell
        run: |
          # STEP 1: LOCATE THE SSIS DEPLOYMENT FILE
          $ispacPath = "${{ github.workspace }}\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"

          if (-not (Test-Path -Path $ispacPath)) {
              Write-Host "Primary path not found. Testing alternate path..."
              $ispacPath = "${{ github.workspace }}\..\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"
              $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
          }

          if (-not (Test-Path -Path $ispacPath)) {
              Write-Error "CRITICAL ERROR: Could not locate TimesheetMigration1.ispac file."
              exit 1
          }

          # STEP 2: DEFINE TARGET CONFIGURATIONS FROM YOUR ENVIRONMENT
          $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
          $dbUser        = "${{ secrets.SQL_USERNAME }}"
          $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
          $initialDb     = "master"
          $targetFolder  = "TimesheetDevTestMigration"
          $projectName   = "TimesheetMigration1"
          $executionJobName = "RunTimesheetDevTestMigrationPK"

          # STEP 3: CONVERT ISPAC FILE INTO BINARY DATA STREAM
          $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
          $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")

          # STEP 4: INITIALIZE SQL SERVER DATABASE CONNECTION
          Write-Host "Establishing local tunnel connection..."

          $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
          $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)

          try {
              $connection.Open()

              # Check if SSISDB exists (should exist from previous step, but double-check)
              $checkCmd = $connection.CreateCommand()
              $checkCmd.CommandText = "SELECT COUNT(*) FROM sys.databases WHERE name = 'SSISDB'"
              $ssisExists = $checkCmd.ExecuteScalar()
              
              if ($ssisExists -eq 0) {
                  Write-Error "SSISDB still does not exist. Cannot deploy SSIS package."
                  exit 1
              }

              # Build the SQL command string
              $sqlQuery = "SET NOCOUNT ON; USE [msdb];`r`n"
              $sqlQuery += "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'RunTimesheetDevTestMigrationPK')`r`n"
              $sqlQuery += "BEGIN`r`n"
              $sqlQuery += "    EXEC dbo.sp_delete_job @job_name = N'RunTimesheetDevTestMigrationPK', @delete_unused_schedule=1;`r`n"
              $sqlQuery += "END`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_add_job @job_name = N'RunTimesheetDevTestMigrationPK', @enabled = 1, @start_step_id = 1;`r`n"
              
              $sqlQuery += "DECLARE @deploy_script NVARCHAR(MAX);`r`n"
              $sqlQuery += "SET @deploy_script = N'USE [SSISDB]; IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = N''$targetFolder'') BEGIN EXEC [catalog].[create_folder] @folder_name = N''$targetFolder''; END DECLARE @project_stream VARBINARY(MAX) = $hexString; EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @project_stream = @project_stream;';`r`n"
              
              $sqlQuery += "EXEC dbo.sp_add_jobstep @job_name = N'RunTimesheetDevTestMigrationPK', @step_name = N'Run Deploy', @subsystem = N'TSQL', @command = @deploy_script, @retry_attempts = 0;`r`n"
              $sqlQuery += "EXEC dbo.sp_add_jobserver @job_name = N'RunTimesheetDevTestMigrationPK', @server_name = N'(local)';`r`n"
              
              $sqlQuery += "DECLARE @deploy_job_id UNIQUEIDENTIFIER;`r`n"
              $sqlQuery += "SELECT @deploy_job_id = job_id FROM msdb.dbo.sysjobs WHERE name = N'RunTimesheetDevTestMigrationPK';`r`n"
              $sqlQuery += "EXEC dbo.sp_start_job @job_name = N'RunTimesheetDevTestMigrationPK';`r`n`r`n"
              
              $sqlQuery += "WHILE EXISTS (`r`n"
              $sqlQuery += "    SELECT 1 FROM msdb.dbo.sysjobactivity `r`n"
              $sqlQuery += "    WHERE job_id = @deploy_job_id AND start_execution_date IS NOT NULL AND stop_execution_date IS NULL`r`n"
              $sqlQuery += ")`r`n"
              $sqlQuery += "BEGIN`r`n"
              $sqlQuery += "    WAITFOR DELAY '00:00:02';`r`n"
              $sqlQuery += "END`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_delete_job @job_name = N'RunTimesheetDevTestMigrationPK';`r`n`r`n"
              
              $sqlQuery += "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')`r`n"
              $sqlQuery += "BEGIN`r`n"
              $sqlQuery += "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;`r`n"
              $sqlQuery += "END`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for $projectName.', @start_step_id = 1;`r`n"
              
              $sqlQuery += "DECLARE @TargetServer NVARCHAR(128) = CAST(SERVERPROPERTY('ServerName') AS NVARCHAR(128));`r`n"
              $sqlQuery += "DECLARE @run_command NVARCHAR(MAX);`r`n"
              $sqlQuery += "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$projectName\TimesheetMigration.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @TargetServer + CHAR(34) + N' /Par ' + CHAR(34) + N'$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';`r`n"
              
              $sqlQuery += "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;`r`n"
              $sqlQuery += "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';`r`n"
              $sqlQuery += "EXEC dbo.sp_add_jobschedule `r`n"
              $sqlQuery += "    @job_name = N'$executionJobName', `r`n"
              $sqlQuery += "    @name = N'Every_1_Minute_8AM_to_5PM', `r`n"
              $sqlQuery += "    @enabled = 1, `r`n"
              $sqlQuery += "    @freq_type = 4, `r`n"
              $sqlQuery += "    @freq_interval = 1, `r`n"
              $sqlQuery += "    @freq_subday_type = 4, `r`n"
              $sqlQuery += "    @freq_subday_interval = 1, `r`n"
              $sqlQuery += "    @active_start_time = 080000, `r`n"
              $sqlQuery += "    @active_end_time = 170000;`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_start_job @job_name = N'$executionJobName';`r`n"
              $sqlQuery += "WAITFOR DELAY '00:00:05';"

              # Replace placeholders
              $sqlQuery = $sqlQuery.Replace('$targetFolder', $targetFolder)
              $sqlQuery = $sqlQuery.Replace('$projectName', $projectName)
              $sqlQuery = $sqlQuery.Replace('$executionJobName', $executionJobName)
              $sqlQuery = $sqlQuery.Replace('$hexString', $hexString)

              $command = $connection.CreateCommand()
              $command.CommandText = $sqlQuery
              $command.ExecuteNonQuery() | Out-Null

              Write-Host "SUCCESS: Local SSIS Project deployed, job triggered, and execution delay finalized!"

          } catch {
              Write-Error "Local Deployment Failed: $_"
              exit 1
          } finally {
              $connection.Close()
          }

  # =========================================================================
  # JOB 2: DEPLOY TO PARTNER SERVER
  # =========================================================================
  deploy-partner:
    name: 2. Deploy to Partner Server
    runs-on: windows-latest
    needs: deploy-local
    environment: partner-sql

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Ensure SSISDB Catalog Exists on Partner Server
        shell: powershell
        run: |
          $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
          $dbUser        = "${{ secrets.SQL_USERNAME }}"
          $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
          
          $connStr = "Data Source=$tunnelAddress;Initial Catalog=master;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
          $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
          
          try {
              $connection.Open()
              Write-Host "Connected to partner SQL Server successfully."
              
              # Check if SSISDB exists
              $checkCmd = $connection.CreateCommand()
              $checkCmd.CommandText = "SELECT COUNT(*) FROM sys.databases WHERE name = 'SSISDB'"
              $exists = $checkCmd.ExecuteScalar()
              
              if ($exists -eq 0) {
                  Write-Host "SSISDB does not exist on partner server. Creating SSISDB catalog..."
                  
                  # Check if Integration Services is installed
                  $checkSsisCmd = $connection.CreateCommand()
                  $checkSsisCmd.CommandText = @"
          IF EXISTS (SELECT * FROM sys.objects WHERE object_id = OBJECT_ID(N'[dbo].[sp_ssis_addcatalog]') AND type in (N'P', N'PC'))
          BEGIN
              SELECT 1 AS HasSSIS
          END
          ELSE
          BEGIN
              SELECT 0 AS HasSSIS
          END
          "@
                  $hasSSIS = $checkSsisCmd.ExecuteScalar()
                  
                  if ($hasSSIS -eq 0) {
                      Write-Warning "Integration Services is not installed or sp_ssis_addcatalog is missing on partner server."
                      Write-Warning "The SSISDB catalog cannot be created programmatically."
                      Write-Warning "Please install SQL Server Integration Services and try again."
                      exit 1
                  }
                  
                  # Create SSISDB catalog
                  $createCmd = $connection.CreateCommand()
                  $createCmd.CommandText = @"
          USE [master];
          DECLARE @return_value int;
          EXEC @return_value = [dbo].[sp_ssis_addcatalog];
          SELECT 'Catalog Creation Return Code: ' + CAST(@return_value AS VARCHAR) AS Result;
          "@
                  
                  try {
                      $result = $createCmd.ExecuteScalar()
                      Write-Host "SSISDB catalog created successfully on partner server! Result: $result"
                      
                      # Wait for catalog to be fully initialized
                      Write-Host "Waiting for SSISDB to initialize..."
                      Start-Sleep -Seconds 10
                  } catch {
                      Write-Error "Failed to create SSISDB catalog on partner server: $_"
                      Write-Error "You may need to create it manually with: EXEC [dbo].[sp_ssis_addcatalog];"
                      exit 1
                  }
              } else {
                  Write-Host "SSISDB catalog already exists on partner server."
              }
              
          } catch {
              Write-Error "Failed to check/create SSISDB on partner server: $_"
              exit 1
          } finally {
              $connection.Close()
          }

      - name: Create Database and Tables on Partner Server
        shell: powershell
        run: |
          # STEP 1: LOCATE THE DATABASE SCRIPT
          $scriptPath = "${{ github.workspace }}\scripts\create_database.sql"
          
          if (-not (Test-Path -Path $scriptPath)) {
              Write-Host "Primary path not found. Testing alternate path..."
              $scriptPath = "${{ github.workspace }}\..\scripts\create_database.sql"
              $scriptPath = [System.IO.Path]::GetFullPath($scriptPath)
          }

          if (-not (Test-Path -Path $scriptPath)) {
              Write-Error "CRITICAL ERROR: Could not locate create_database.sql file."
              exit 1
          }

          # STEP 2: DEFINE TARGET CONFIGURATIONS FROM YOUR ENVIRONMENT
          $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
          $dbUser        = "${{ secrets.SQL_USERNAME }}"
          $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
          $initialDb     = "master"

          # STEP 3: READ THE SCRIPT FILE
          Write-Host "Reading database creation script..."
          $scriptContent = Get-Content -Path $scriptPath -Raw

          # STEP 4: EXECUTE THE DATABASE SCRIPT
          Write-Host "Establishing tunnel connection to create database on partner server..."

          $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
          $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)

          try {
              $connection.Open()
              
              # Split the script by GO statements
              $scriptParts = @()
              $currentBatch = ""
              
              foreach ($line in $scriptContent -split "`r`n|`n|`r") {
                  $trimmedLine = $line.Trim()
                  
                  if ($trimmedLine -match "^(?i)GO\s*$") {
                      if ($currentBatch.Trim() -ne "") {
                          $scriptParts += $currentBatch
                          $currentBatch = ""
                      }
                  } else {
                      if ($currentBatch -ne "") {
                          $currentBatch += "`r`n"
                      }
                      $currentBatch += $line
                  }
              }
              
              if ($currentBatch.Trim() -ne "") {
                  $scriptParts += $currentBatch
              }
              
              foreach ($part in $scriptParts) {
                  $trimmedPart = $part.Trim()
                  if ($trimmedPart -ne "") {
                      Write-Host "Executing SQL block on partner server..."
                      try {
                          $command = $connection.CreateCommand()
                          $command.CommandText = $trimmedPart
                          $command.ExecuteNonQuery() | Out-Null
                          Write-Host "SQL block executed successfully on partner server."
                      } catch {
                          Write-Host "Warning: Error executing SQL block on partner server: $_"
                          Write-Host "SQL Block Content:"
                          Write-Host $trimmedPart
                      }
                  }
              }

              Write-Host "SUCCESS: Database and tables created successfully on partner server!"

          } catch {
              Write-Error "Database Creation Failed on partner server: $_"
              exit 1
          } finally {
              $connection.Close()
          }

      - name: Deploy SSIS and Create Execution Job (Partner)
        shell: powershell
        run: |
          # STEP 1: LOCATE THE SSIS DEPLOYMENT FILE
          $ispacPath = "${{ github.workspace }}\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"

          if (-not (Test-Path -Path $ispacPath)) {
              Write-Host "Primary path not found. Testing alternate path..."
              $ispacPath = "${{ github.workspace }}\..\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"
              $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
          }

          if (-not (Test-Path -Path $ispacPath)) {
              Write-Error "CRITICAL ERROR: Could not locate TimesheetMigration1.ispac file."
              exit 1
          }

          # STEP 2: DEFINE TARGET CONFIGURATIONS FROM YOUR ENVIRONMENT
          $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
          $dbUser        = "${{ secrets.SQL_USERNAME }}"
          $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
          $initialDb     = "master"

          $targetFolder     = "TimesheetProductionMigration"
          $projectName      = "TimesheetMigration"
          $executionJobName = "RunTimesheetProductionMigrationPK"
          $partnerServer    = "DESKTOP-DBA1BPB\SQLSERVER2025"

          # STEP 3: CONVERT ISPAC FILE INTO BINARY DATA STREAM
          $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
          $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")

          # STEP 4: INITIALIZE SQL SERVER DATABASE CONNECTION VIA TUNNEL
          Write-Host "Establishing tunnel connection to partner environment..."

          $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
          $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)

          try {
              $connection.Open()

              # Check if SSISDB exists (should exist from previous step, but double-check)
              $checkCmd = $connection.CreateCommand()
              $checkCmd.CommandText = "SELECT COUNT(*) FROM sys.databases WHERE name = 'SSISDB'"
              $ssisExists = $checkCmd.ExecuteScalar()
              
              if ($ssisExists -eq 0) {
                  Write-Error "SSISDB still does not exist on partner server. Cannot deploy SSIS package."
                  exit 1
              }

              # Build the SQL command string
              $sqlQuery = "SET NOCOUNT ON; USE [msdb];`r`n"
              $sqlQuery += "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'RunTimesheetProductionMigrationPK')`r`n"
              $sqlQuery += "BEGIN`r`n"
              $sqlQuery += "    EXEC dbo.sp_delete_job @job_name = N'RunTimesheetDevTestMigrationPK', @delete_unused_schedule=1;`r`n"
              $sqlQuery += "END`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_add_job @job_name = N'RunTimesheetDevTestMigrationPK', @enabled = 1, @start_step_id = 1;`r`n`r`n"
              
              $sqlQuery += "DECLARE @deploy_script NVARCHAR(MAX);`r`n"
              $sqlQuery += "SET @deploy_script = N'USE [SSISDB];`r`n"
              $sqlQuery += "IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = N''$targetFolder'')`r`n"
              $sqlQuery += "BEGIN`r`n"
              $sqlQuery += "    EXEC [catalog].[create_folder] @folder_name = N''$targetFolder'';`r`n"
              $sqlQuery += "END`r`n"
              $sqlQuery += "DECLARE @project_stream VARBINARY(MAX) = $hexString;`r`n"
              $sqlQuery += "EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @project_stream = @project_stream;`r`n`r`n"
              
              $sqlQuery += "EXEC SSISDB.catalog.set_object_parameter_value @object_type = 30, @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @object_name = N''TimesheetMigration1.dtsx'', @parameter_name = N''CM.LAPTOP-7LSAQSR0\SQLSERVER2025.master1.ServerName'', @parameter_value = N''$partnerServer'';`r`n"
              $sqlQuery += "EXEC SSISDB.catalog.set_object_parameter_value @object_type = 30, @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @object_name = N''TimesheetMigration1.dtsx'', @parameter_name = N''CM.LAPTOP-7LSAQSR0\SQLSERVER2025.TimesheetDB1.ServerName'', @parameter_value = N''$partnerServer'';`r`n"
              $sqlQuery += "EXEC SSISDB.catalog.set_object_parameter_value @object_type = 30, @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @object_name = N''TimesheetMigration1.dtsx'', @parameter_name = N''CM.LAPTOP-7LSAQSR0\SQLSERVER2025.master1.InitialCatalog'', @parameter_value = N''master'';`r`n"
              $sqlQuery += "EXEC SSISDB.catalog.set_object_parameter_value @object_type = 30, @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @object_name = N''TimesheetMigration1.dtsx'', @parameter_name = N''CM.LAPTOP-7LSAQSR0\SQLSERVER2025.TimesheetDB1.InitialCatalog'', @parameter_value = N''TimesheetDB1'';';`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_add_jobstep @job_name = N'RunTimesheetDevTestMigrationPK', @step_name = N'Run Deploy', @subsystem = N'TSQL', @command = @deploy_script, @retry_attempts = 0;`r`n"
              $sqlQuery += "EXEC dbo.sp_add_jobserver @job_name = N'RunTimesheetDevTestMigrationPK', @server_name = N'(local)';`r`n"
              
              $sqlQuery += "DECLARE @deploy_job_id UNIQUEIDENTIFIER;`r`n"
              $sqlQuery += "SELECT @deploy_job_id = job_id FROM msdb.dbo.sysjobs WHERE name = N'RunTimesheetDevTestMigrationPK';`r`n"
              $sqlQuery += "EXEC dbo.sp_start_job @job_name = N'RunTimesheetDevTestMigrationPK';`r`n`r`n"
              
              $sqlQuery += "WHILE EXISTS (`r`n"
              $sqlQuery += "    SELECT 1 FROM msdb.dbo.sysjobactivity `r`n"
              $sqlQuery += "    WHERE job_id = @deploy_job_id AND start_execution_date IS NOT NULL AND stop_execution_date IS NULL`r`n"
              $sqlQuery += ")`r`n"
              $sqlQuery += "BEGIN`r`n"
              $sqlQuery += "    WAITFOR DELAY '00:00:02';`r`n"
              $sqlQuery += "END`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_delete_job @job_name = N'RunTimesheetDevTestMigrationPK';`r`n`r`n"
              
              $sqlQuery += "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')`r`n"
              $sqlQuery += "BEGIN`r`n"
              $sqlQuery += "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;`r`n"
              $sqlQuery += "END`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for $projectName.', @start_step_id = 1;`r`n`r`n"
              
              $sqlQuery += "DECLARE @TargetServer NVARCHAR(128) = CAST(SERVERPROPERTY('ServerName') AS NVARCHAR(128));`r`n"
              $sqlQuery += "DECLARE @run_command NVARCHAR(MAX);`r`n"
              $sqlQuery += "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$projectName\TimesheetMigration.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @TargetServer + CHAR(34) + N' /Par ' + CHAR(34) + N'$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;`r`n"
              $sqlQuery += "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';`r`n"
              $sqlQuery += "EXEC dbo.sp_add_jobschedule`r`n"
              $sqlQuery += "    @job_name = N'$executionJobName',`r`n"
              $sqlQuery += "    @name = N'Every_1_Minute_8AM_to_5PM',`r`n"
              $sqlQuery += "    @enabled = 1,`r`n"
              $sqlQuery += "    @freq_type = 4,`r`n"
              $sqlQuery += "    @freq_interval = 1,`r`n"
              $sqlQuery += "    @freq_subday_type = 4,`r`n"
              $sqlQuery += "    @freq_subday_interval = 1,`r`n"
              $sqlQuery += "    @active_start_time = 080000,`r`n"
              $sqlQuery += "    @active_end_time = 170000;`r`n`r`n"
              
              $sqlQuery += "EXEC dbo.sp_start_job @job_name = N'$executionJobName';`r`n"
              $sqlQuery += "WAITFOR DELAY '00:00:05';"

              # Replace placeholders
              $sqlQuery = $sqlQuery.Replace('$targetFolder', $targetFolder)
              $sqlQuery = $sqlQuery.Replace('$projectName', $projectName)
              $sqlQuery = $sqlQuery.Replace('$executionJobName', $executionJobName)
              $sqlQuery = $sqlQuery.Replace('$partnerServer', $partnerServer)
              $sqlQuery = $sqlQuery.Replace('$hexString', $hexString)

              $command = $connection.CreateCommand()
              $command.CommandText = $sqlQuery
              $command.ExecuteNonQuery() | Out-Null

              Write-Host "SUCCESS: Partner deployment completed, configuration overrides applied, and task triggered!"

          } catch {
              Write-Error "Partner Execution Failed: $_"
              exit 1
          } finally {
              $connection.Close()
          }