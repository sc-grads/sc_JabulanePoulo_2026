name: Deploy Database and Run Migration

run-name: >
  Deploy Database - ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:

###############################################################################
# DEPLOY TO YOUR DATABASE
###############################################################################

  DeployLocal:
    name: Deploy to Local SQL

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      environment-name: local-sql
      sql-script-path: scripts/create_database.sql

    secrets: inherit


###############################################################################
# DEPLOY TO PARTNER DATABASE
###############################################################################

  DeployPartner:
    name: Deploy to Partner SQL

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      environment-name: partner-sql
      sql-script-path: scripts/create_database.sql

    secrets: inherit


###############################################################################
# RUN MIGRATION (LOCAL)
###############################################################################

  LocalMigration:

    needs: DeployLocal

    runs-on: ubuntu-latest

    environment: local-sql

    if: success()

    steps:

      - uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc

          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
          | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Run TimesheetMigration

        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}

        run: |

          echo "Starting SQL Agent Job..."

          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d msdb \
            -Q "EXEC dbo.sp_start_job N'TimesheetMigration';" \
            -b \
            -C

          echo "Waiting..."

          sleep 15

          STATUS=$(
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d msdb \
            -Q "SET NOCOUNT ON;
                SELECT TOP 1
                CASE
                WHEN run_status=1 THEN 'Succeeded'
                WHEN run_status=0 THEN 'Failed'
                WHEN run_status=3 THEN 'Cancelled'
                ELSE 'Running'
                END
                FROM sysjobhistory h
                JOIN sysjobs j
                ON h.job_id=j.job_id
                WHERE j.name='TimesheetMigration'
                ORDER BY instance_id DESC;" \
            -h -1 \
            -C | tr -d '[:space:]'
          )

          echo "Status: $STATUS"

          if [ "$STATUS" != "Succeeded" ]; then
            exit 1
          fi


###############################################################################
# RUN MIGRATION (PARTNER)
###############################################################################

  PartnerMigration:

    needs: DeployPartner

    runs-on: ubuntu-latest

    environment: partner-sql

    if: success()

    steps:

      - uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc

          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
          | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18

      - name: Run TimesheetMigration

        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}

        run: |

          echo "Starting SQL Agent Job..."

          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d msdb \
            -Q "EXEC dbo.sp_start_job N'TimesheetMigration';" \
            -b \
            -C

          sleep 15

          STATUS=$(
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d msdb \
            -Q "SET NOCOUNT ON;
                SELECT TOP 1
                CASE
                WHEN run_status=1 THEN 'Succeeded'
                WHEN run_status=0 THEN 'Failed'
                WHEN run_status=3 THEN 'Cancelled'
                ELSE 'Running'
                END
                FROM sysjobhistory h
                JOIN sysjobs j
                ON h.job_id=j.job_id
                WHERE j.name='TimesheetMigration'
                ORDER BY instance_id DESC;" \
            -h -1 \
            -C | tr -d '[:space:]'
          )

          echo "Status: $STATUS"

          if [ "$STATUS" != "Succeeded" ]; then
            exit 1
          fi


###############################################################################
# SUCCESS NOTIFICATION
###############################################################################

  Success:

    needs:
      - LocalMigration
      - PartnerMigration

    if: success()

    runs-on: ubuntu-latest

    steps:

      - name: Notify Teams

        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |

          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            exit 0
          fi

          curl \
          -H "Content-Type: application/json" \
          -d '{
          "title":"Deployment Successful",
          "text":"Database deployed successfully to both environments."
          }' \
          "$TEAMS_WEBHOOK_URL"


###############################################################################
# FAILURE NOTIFICATION
###############################################################################

  Failure:

    needs:
      - DeployLocal
      - DeployPartner
      - LocalMigration
      - PartnerMigration

    if: failure()

    runs-on: ubuntu-latest

    steps:

      - name: Notify Teams

        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |

          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            exit 0
          fi

          curl \
          -H "Content-Type: application/json" \
          -d '{
          "title":"Deployment Failed",
          "text":"One or more deployment stages failed."
          }' \
          "$TEAMS_WEBHOOK_URL"