name: Pinggys SSIS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  DevTest_Deploy:
    name: DevTest/Deploy
    runs-on: windows-latest
    environment: local-sql

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # === Install SQL Server Integration Services Tools ===
      - name: Install SSIS PowerShell Module & Assemblies
        shell: pwsh
        run: |
          Write-Host "Installing SQL Server Integration Services components..."

          # Install latest SqlServer module (includes IntegrationServices)
          Install-Module -Name SqlServer -Scope CurrentUser -Force -AllowClobber -Verbose

          # Alternative: Download and register the assembly if needed
          Write-Host "Checking for IntegrationServices assembly..."
          try {
            [System.Reflection.Assembly]::LoadWithPartialName("Microsoft.SqlServer.Management.IntegrationServices") | Out-Null
            Write-Host "✓ Assembly already available"
          } catch {
            Write-Host "Assembly not found. Attempting to load via SqlServer module..."
          }

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d master -i "scripts/create_database.sql" -b
          Write-Host "Database deployment completed."

      # --- STEP 2-4: Catalog, Folder, Delete Project (same as before) ---
      - name: Initialize SSIS Catalog & Folder
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          $server = $env:SERVER
          $user = $env:USERNAME
          $pass = $env:PASSWORD
          $folderName = "TimesheetDevTestMigration"
          $projectName = "TimesheetMigration1"

          # Create SSISDB if missing
          $ssisdbExists = sqlcmd -S $server -U $user -P $pass -d master -Q "SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" -h-1 | Select-Object -First 1
          if ($ssisdbExists -eq 0) {
            sqlcmd -S $server -U $user -P $pass -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '$pass';"
          }

          # Create Folder
          $folderExists = sqlcmd -S $server -U $user -P $pass -d SSISDB -Q "SELECT COUNT(*) FROM [catalog].[folders] WHERE name='$folderName'" -h-1 | Select-Object -First 1
          if ($folderExists -eq 0) {
            sqlcmd -S $server -U $user -P $pass -d SSISDB -Q "EXEC [catalog].[create_folder] @folder_name=N'$folderName';"
          }

          # Delete existing project
          sqlcmd -S $server -U $user -P $pass -d SSISDB -Q "
            DECLARE @id bigint = (SELECT p.project_id FROM [catalog].[projects] p 
                                  JOIN [catalog].[folders] f ON p.folder_id = f.folder_id 
                                  WHERE f.name = '$folderName' AND p.name = '$projectName')
            IF @id IS NOT NULL EXEC [catalog].[delete_project] @project_id = @id;" 2>$null

      # --- MAIN DEPLOYMENT STEP ---
      - name: Deploy SSIS Project
        id: deploy_ssis
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          Import-Module SqlServer -Force

          $packagePath = "ssis-packages/TimesheetMigration1.ispac"
          $folderName = "TimesheetDevTestMigration"
          $projectName = "TimesheetMigration1"

          if (-not (Test-Path $packagePath)) {
            Write-Error "Package not found: $packagePath"
            exit 1
          }

          $connString = "Data Source=$env:SERVER;Initial Catalog=SSISDB;User ID=$env:USERNAME;Password=$env:PASSWORD;TrustServerCertificate=True"
          $conn = New-Object System.Data.SqlClient.SqlConnection($connString)
          $conn.Open()

          $integrationServices = New-Object Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices($conn)
          $catalog = $integrationServices.Catalogs["SSISDB"]

          if (-not $catalog.Folders.Contains($folderName)) {
            $folder = New-Object Microsoft.SqlServer.Management.IntegrationServices.CatalogFolder($catalog, $folderName, "Timesheet Folder")
            $folder.Create()
          } else {
            $folder = $catalog.Folders[$folderName]
          }

          Write-Host "Deploying project '$projectName'..."
          $bytes = [System.IO.File]::ReadAllBytes($packagePath)
          $folder.DeployProject($projectName, $bytes)

          Write-Host "✅ SSIS Project deployed successfully!"
          "DEPLOYMENT_STATUS=success" >> $env:GITHUB_OUTPUT

          $conn.Close()

      # --- VERIFY ---
      - name: Verify Deployment
        if: steps.deploy_ssis.outputs.DEPLOYMENT_STATUS == 'success'
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        shell: pwsh
        run: |
          sqlcmd -S "${env:SERVER}" -U "$env:USERNAME" -P "$env:PASSWORD" -d SSISDB `
            -Q "SELECT f.name as Folder, p.name as Project FROM [catalog].[folders] f JOIN [catalog].[projects] p ON f.folder_id = p.folder_id WHERE f.name = 'TimesheetDevTestMigration'"

  # Production job can be mirrored similarly...