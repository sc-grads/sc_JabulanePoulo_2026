name: Pinggys SSIS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  DevTest_Deploy:
    name: DevTest/Deploy
    runs-on: ubuntu-latest
    environment: local-sql
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SQLCMD and Python
        run: |
          # Install SQLCMD
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          
          # Install Python and pyodbc for SSIS deployment
          sudo apt-get install -y python3 python3-pip
          pip3 install pyodbc

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Deploying TimesheetsDB to DevTest..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -i "scripts/create_database.sql" \
            -b \
            -C
          echo "Database deployment completed."

      # --- STEP 2: SSIS CATALOG ---
      - name: Initialize SSIS Catalog (SSISDB) if Missing
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Checking if SSISDB exists..."
          
          SSISDB_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$SSISDB_EXISTS" == "0" ]; then
            echo "Creating SSISDB..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d master \
              -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '${{ secrets.SQL_PASSWORD }}';" \
              -C
            echo "SSISDB created successfully."
          else
            echo "SSISDB already exists."
          fi

      # --- STEP 3: CREATE SSIS FOLDER ---
      - name: Create SSIS Folder
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          FOLDER_NAME="TimesheetDevTestMigration"
          echo "Verifying SSIS folder: $FOLDER_NAME"
          
          FOLDER_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name='$FOLDER_NAME'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$FOLDER_EXISTS" == "0" ]; then
            echo "Folder '$FOLDER_NAME' not found. Creating..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d SSISDB \
              -Q "EXEC [SSISDB].[catalog].[create_folder] @folder_name=N'$FOLDER_NAME', @folder_id=0;" \
              -C
            echo "Folder '$FOLDER_NAME' created successfully."
          else
            echo "Folder '$FOLDER_NAME' already exists."
          fi

      # --- STEP 4: DEPLOY SSIS PACKAGE (USING PYTHON) ---
      - name: Deploy SSIS Package (.ispac) to DevTest
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
          PACKAGE_PATH: ssis-packages/TimesheetMigration1.ispac
          FOLDER_NAME: TimesheetDevTestMigration
          PROJECT_NAME: TimesheetMigration1
        run: |
          echo "Checking for package at: $PACKAGE_PATH"
          
          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "Error: Package file $PACKAGE_PATH not found!"
            ls -la
            ls -la ssis-packages/ 2>/dev/null || echo "ssis-packages directory not found"
            exit 1
          fi
          
          echo "Deploying SSIS package using Python..."
          
          # Create Python deployment script
          python3 << 'PYEOF'
          import base64
          import pyodbc
          import os
          
          # Get environment variables
          server = os.environ.get('SERVER', 'localhost')
          port = os.environ.get('PORT', '1433')
          username = os.environ.get('USERNAME', 'sa')
          password = os.environ.get('PASSWORD', '')
          package_path = os.environ.get('PACKAGE_PATH', 'ssis-packages/TimesheetMigration1.ispac')
          folder_name = os.environ.get('FOLDER_NAME', 'TimesheetDevTestMigration')
          project_name = os.environ.get('PROJECT_NAME', 'TimesheetMigration1')
          
          print(f"Connecting to: {server},{port}")
          print(f"Deploying to folder: {folder_name}")
          print(f"Project name: {project_name}")
          
          # Read and encode package
          try:
              with open(package_path, 'rb') as f:
                  package_bytes = f.read()
                  package_base64 = base64.b64encode(package_bytes).decode('utf-8')
              print(f"Package size: {len(package_bytes)} bytes")
          except Exception as e:
              print(f"Error reading package: {e}")
              exit(1)
          
          # Connect to SQL Server
          conn_str = f'DRIVER={{ODBC Driver 18 for SQL Server}};SERVER={server},{port};DATABASE=SSISDB;UID={username};PWD={password};TrustServerCertificate=yes;'
          
          try:
              conn = pyodbc.connect(conn_str)
              cursor = conn.cursor()
              
              # First, check if folder exists
              cursor.execute("SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name = ?", (folder_name,))
              folder_count = cursor.fetchone()[0]
              
              if folder_count == 0:
                  print(f"Error: Folder '{folder_name}' does not exist!")
                  print("Please create the folder first.")
                  exit(1)
              
              # Deploy project
              sql = """
              DECLARE @project_binary varbinary(max);
              DECLARE @base64 varchar(max) = ?;
              SET @project_binary = CAST(N'' AS XML).value('xs:base64Binary(sql:variable("@base64"))', 'varbinary(max)');
              EXEC [SSISDB].[catalog].[deploy_project] 
                @folder_name = ?,
                @project_name = ?,
                @project_stream = @project_binary;
              """
              
              print("Executing deployment...")
              cursor.execute(sql, (package_base64, folder_name, project_name))
              cursor.commit()
              
              print(f"Successfully deployed '{project_name}' to folder '{folder_name}'")
              
              # Verify deployment
              cursor.execute("""
                  SELECT COUNT(*) 
                  FROM [SSISDB].[catalog].[projects] p
                  INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                  WHERE f.name = ? AND p.name = ?
              """, (folder_name, project_name))
              
              project_count = cursor.fetchone()[0]
              if project_count == 1:
                  print("Verification successful: Project found in SSISDB")
              else:
                  print("Warning: Project not found in SSISDB after deployment")
              
          except Exception as e:
              print(f"Error during deployment: {e}")
              exit(1)
          finally:
              if 'conn' in locals():
                  conn.close()
          PYEOF
          
          echo "SSIS package deployed successfully!"

      # --- STEP 5: VERIFY DEPLOYMENT ---
      - name: Verify SSIS Deployment
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Verifying SSIS deployment..."
          
          FOLDER_NAME="TimesheetDevTestMigration"
          PROJECT_NAME="TimesheetMigration1"
          
          PROJECT_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -Q "SET NOCOUNT ON; 
                SELECT COUNT(*) 
                FROM [SSISDB].[catalog].[projects] p
                INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                WHERE f.name = '$FOLDER_NAME' 
                  AND p.name = '$PROJECT_NAME'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$PROJECT_EXISTS" -eq "1" ]; then
            echo "SSIS deployment verified successfully!"
            
            echo ""
            echo "Packages in project:"
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d SSISDB \
              -Q "SET NOCOUNT ON; 
                  SELECT f.name as FolderName, p.name as ProjectName, pk.name as PackageName
                  FROM [SSISDB].[catalog].[packages] pk
                  INNER JOIN [SSISDB].[catalog].[projects] p ON pk.project_id = p.project_id
                  INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                  WHERE f.name = '$FOLDER_NAME' AND p.name = '$PROJECT_NAME'" \
              -C
          else
            echo "SSIS project not found in SSISDB."
            exit 1
          fi

      # --- STEP 6: CREATE JOB ---
      - name: Create DevTest SQL Agent Job
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Creating SQL Agent Job..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d msdb \
            -i "scripts/create_job.sql" \
            -C
          echo "Job created successfully."

      # --- STEP 7: RUN THE JOB ---
      - name: Run DevTest Migration Job
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Starting SQL Agent Job..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d msdb \
            -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" \
            -C
          echo "Job started."

  # ==========================================
  # 2. Stage: Production/Deploy
  # ==========================================
  Production_Deploy:
    name: Production/Deploy
    runs-on: ubuntu-latest
    needs: DevTest_Deploy
    environment: partner-sql
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SQLCMD and Python
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          sudo apt-get install -y python3 python3-pip
          pip3 install pyodbc

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "Deploying TimesheetsDB to Production (Partner)..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -i "scripts/create_database.sql" \
            -b \
            -C

      # --- STEP 2: SSIS CATALOG ---
      - name: Initialize SSIS Catalog (SSISDB) if Missing (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          SSISDB_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d master \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$SSISDB_EXISTS" == "0" ]; then
            echo "Creating SSISDB (Partner)..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d master \
              -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '${{ secrets.PARTNER_SQL_PASSWORD }}';" \
              -C
          fi

      # --- STEP 3: CREATE SSIS FOLDER ---
      - name: Create SSIS Folder (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          FOLDER_NAME="TimesheetDevTestMigration"
          FOLDER_EXISTS=$(/opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d SSISDB \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name='$FOLDER_NAME'" \
            -h-1 \
            -C | tr -d '[:space:]')
          
          if [ "$FOLDER_EXISTS" == "0" ]; then
            echo "Creating SSIS folder '$FOLDER_NAME' (Partner)..."
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d SSISDB \
              -Q "EXEC [SSISDB].[catalog].[create_folder] @folder_name=N'$FOLDER_NAME', @folder_id=0;" \
              -C
          else
            echo "Folder '$FOLDER_NAME' already exists (Partner)."
          fi

      # --- STEP 4: DEPLOY SSIS PACKAGE ---
      - name: Deploy SSIS Package (.ispac) to Partner
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
          PACKAGE_PATH: ssis-packages/TimesheetMigration1.ispac
          FOLDER_NAME: TimesheetDevTestMigration
          PROJECT_NAME: TimesheetMigration1
        run: |
          echo "Checking for package at: $PACKAGE_PATH"
          
          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "Error: Package file $PACKAGE_PATH not found!"
            exit 1
          fi
          
          echo "Deploying SSIS package using Python..."
          
          python3 << 'PYEOF'
          import base64
          import pyodbc
          import os
          
          server = os.environ.get('SERVER', 'localhost')
          port = os.environ.get('PORT', '1433')
          username = os.environ.get('USERNAME', 'sa')
          password = os.environ.get('PASSWORD', '')
          package_path = os.environ.get('PACKAGE_PATH', 'ssis-packages/TimesheetMigration1.ispac')
          folder_name = os.environ.get('FOLDER_NAME', 'TimesheetDevTestMigration')
          project_name = os.environ.get('PROJECT_NAME', 'TimesheetMigration1')
          
          with open(package_path, 'rb') as f:
              package_bytes = f.read()
              package_base64 = base64.b64encode(package_bytes).decode('utf-8')
          
          conn_str = f'DRIVER={{ODBC Driver 18 for SQL Server}};SERVER={server},{port};DATABASE=SSISDB;UID={username};PWD={password};TrustServerCertificate=yes;'
          
          try:
              conn = pyodbc.connect(conn_str)
              cursor = conn.cursor()
              
              sql = """
              DECLARE @project_binary varbinary(max);
              DECLARE @base64 varchar(max) = ?;
              SET @project_binary = CAST(N'' AS XML).value('xs:base64Binary(sql:variable("@base64"))', 'varbinary(max)');
              EXEC [SSISDB].[catalog].[deploy_project] 
                @folder_name = ?,
                @project_name = ?,
                @project_stream = @project_binary;
              """
              
              cursor.execute(sql, (package_base64, folder_name, project_name))
              cursor.commit()
              
              print(f"Successfully deployed '{project_name}' to '{folder_name}'")
              
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          finally:
              if 'conn' in locals():
                  conn.close()
          PYEOF

      # --- STEP 5: CREATE JOB ---
      - name: Create Partner SQL Agent Job
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          if [ -f "scripts/create_job.sql" ]; then
            /opt/mssql-tools18/bin/sqlcmd \
              -S "${SERVER},${PORT:-1433}" \
              -U "$USERNAME" \
              -P "$PASSWORD" \
              -d msdb \
              -i "scripts/create_job.sql" \
              -C
          fi

      # --- STEP 6: RUN THE JOB ---
      - name: Run Partner Migration Job
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          echo "Starting Partner SQL Agent Job..."
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT:-1433}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d msdb \
            -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" \
            -C || echo "Warning: Job may not exist or SQL Agent is not running"