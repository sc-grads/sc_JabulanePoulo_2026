name: Deploy Database and Run Migration

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:

  DevTest:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: local-sql
      runner-label: Jabulane
      sql-script-path: scripts/create_database.sql
    secrets: inherit

  request_approval_partner:
    name: Request Partner Approval
    needs: DevTest
    runs-on: ubuntu-latest
    environment: partner-sql

    steps:
      - name: Waiting for approval
        run: echo "Waiting for partner approval..."

  Production:
    needs: request_approval_partner
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: partner-sql
      runner-label: Kayden
      sql-script-path: scripts/create_database.sql
    secrets: inherit

  RunMigrationJob:
    name: Run SQL Agent Job
    needs: Production

    runs-on:
      - self-hosted
      - Kayden

    environment: partner-sql

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run TimesheetMigration SQL Agent Job
        shell: cmd
        env:
          SERVER: ${{ secrets.SQL_SERVER }}

        run: |

          Write-Host "Checking for SQL Agent Job..."

          $JobExists = (
            sqlcmd `
              -S $env:SERVER `
              -d msdb `
              -Q "SET NOCOUNT ON;
                  SELECT COUNT(*)
                  FROM dbo.sysjobs
                  WHERE name='TimesheetMigration';" `
              -h -1
          ).Trim()

          if ($JobExists -ne "1")
          {
              Write-Host "TimesheetMigration job not found."
              exit 1
          }

          Write-Host "Starting SQL Agent Job..."

          sqlcmd `
            -S $env:SERVER `
            -d msdb `
            -Q "EXEC dbo.sp_start_job @job_name='TimesheetMigration';"

          Start-Sleep -Seconds 15

          $Status = (
            sqlcmd `
              -S $env:SERVER `
              -d msdb `
              -Q "
              SET NOCOUNT ON;

              SELECT TOP (1)
                CASE run_status
                    WHEN 0 THEN 'Failed'
                    WHEN 1 THEN 'Succeeded'
                    WHEN 2 THEN 'Retry'
                    WHEN 3 THEN 'Cancelled'
                    ELSE 'Unknown'
                END
              FROM dbo.sysjobhistory h
              JOIN dbo.sysjobs j
                ON h.job_id = j.job_id
              WHERE j.name='TimesheetMigration'
              ORDER BY instance_id DESC;
              " `
              -h -1
          ).Trim()

          Write-Host "Job Status: $Status"

          if ($Status -eq "Failed" -or $Status -eq "Cancelled")
          {
              throw "Migration job failed."
          }

          Write-Host "Migration completed successfully."

  notify_success:
    name: Notify Success
    needs:
      - DevTest
      - Production
      - RunMigrationJob

    if: success()

    runs-on: ubuntu-latest

    steps:
      - run: echo "Deployment completed successfully."

  notify_failure:
    name: Notify Failure
    needs:
      - DevTest
      - Production
      - RunMigrationJob

    if: failure()

    runs-on: ubuntu-latest

    steps:
      - run: echo "Deployment failed."