name: Deploy SSIS via Pinggy Tunnel

on:
  push:

jobs:

  # ====================================================================
  # JOB 1: CREATE DATABASE AND DEPLOY TO LOCAL LAPTOP
  # ====================================================================
  deploy-local:
    name: DevTest/Deploy
    runs-on: windows-latest
    environment: local-sql

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Create Database on Local Server
      shell: powershell
      run: |
        # STEP 1: DEFINE TARGET CONFIGURATIONS FROM YOUR ENVIRONMENT
        $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
        $dbUser        = "${{ secrets.SQL_USERNAME }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $initialDb     = "master"
        $targetDb      = "TimesheetJPDB"
        
        # STEP 2: PATH TO CREATE DATABASE SCRIPT (located in scripts folder)
        $createDbScript = "${{ github.workspace }}\scripts\create_database.sql"
        
        if (-not (Test-Path -Path $createDbScript)) {
            Write-Host "Primary path not found. Testing alternate path..."
            $createDbScript = "${{ github.workspace }}\..\scripts\create_database.sql"
            $createDbScript = [System.IO.Path]::GetFullPath($createDbScript)
        }
        
        if (-not (Test-Path -Path $createDbScript)) {
            Write-Error "CRITICAL ERROR: Could not locate create_database.sql file in scripts folder."
            exit 1
        }
        
        Write-Host "Found create_database.sql at: $createDbScript"
        
        # STEP 3: READ THE SQL SCRIPT
        $sqlScript = Get-Content -Path $createDbScript -Raw
        Write-Host "Original SQL Script Length: $($sqlScript.Length)"
        
        # STEP 4: REMOVE GO STATEMENTS AND CREATE DATABASE/USE STATEMENTS
        # Split by GO statements and process each part
        $scriptParts = $sqlScript -split "(?i)^\s*GO\s*$" -match "\S"
        
        # Filter out CREATE DATABASE and USE statements
        $filteredParts = @()
        foreach ($part in $scriptParts) {
            # Skip parts that only contain CREATE DATABASE or USE statements
            $trimmed = $part.Trim()
            if ($trimmed -match "(?i)^CREATE\s+DATABASE\s+\[.*?\]\s*;?$") {
                Write-Host "Skipping CREATE DATABASE statement"
                continue
            }
            if ($trimmed -match "(?i)^USE\s+\[.*?\]\s*;?$") {
                Write-Host "Skipping USE statement"
                continue
            }
            if ($trimmed -ne "") {
                $filteredParts += $part
            }
        }
        
        # Join the filtered parts back together
        $cleanScript = ($filteredParts -join "`r`n`r`n").Trim()
        Write-Host "Cleaned SQL Script Length: $($cleanScript.Length)"
        
        if ($cleanScript.Length -eq 0) {
            Write-Host "WARNING: No SQL commands found after filtering. Skipping schema creation."
            exit 0
        }
        
        # STEP 5: FIRST CREATE THE DATABASE
        Write-Host "Creating database $targetDb on Local Server..."
        
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        
        try {
            $connection.Open()
            
            # Create the database
            $createDbCmd = $connection.CreateCommand()
            $createDbCmd.CommandText = "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$targetDb') CREATE DATABASE [$targetDb];"
            $createDbCmd.CommandTimeout = 60
            $createDbCmd.ExecuteNonQuery() | Out-Null
            
            Write-Host "Database $targetDb is ready!"
            
        } catch {
            Write-Error "Failed to create/verify database: $_"
            exit 1
        } finally {
            $connection.Close()
        }
        
        # STEP 6: EXECUTE THE SCRIPT IN THE TARGET DATABASE
        Write-Host "Creating tables and schema in $targetDb on Local Server..."
        
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$targetDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        
        try {
            $connection.Open()
            
            # Execute each batch separately
            $batches = $cleanScript -split "(?i)\s*GO\s*" | Where-Object { $_.Trim() -ne "" }
            
            foreach ($batch in $batches) {
                if ($batch.Trim() -ne "") {
                    $command = $connection.CreateCommand()
                    $command.CommandText = $batch.Trim()
                    $command.CommandTimeout = 120
                    $command.ExecuteNonQuery() | Out-Null
                    Write-Host "Executed batch successfully."
                }
            }
            
            Write-Host "SUCCESS: Database schema and tables created successfully on Local Server!"
            
        } catch {
            Write-Error "Local Database Schema Creation Failed: $_"
            Write-Host "SQL Script that was attempted:"
            Write-Host $cleanScript.Substring(0, [Math]::Min(1000, $cleanScript.Length))
            exit 1
        } finally {
            $connection.Close()
        }

    - name: Deploy SSIS and Create Execution Job
      shell: powershell
      run: |
        # STEP 1: LOCATE THE SSIS DEPLOYMENT FILE
        $ispacPath = "${{ github.workspace }}\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"
        
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing alternate path..."
            $ispacPath = "${{ github.workspace }}\..\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
        
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetMigration1.ispac file."
            exit 1
        }
        
        # STEP 2: DEFINE TARGET CONFIGURATIONS FROM YOUR ENVIRONMENT
        $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
        $dbUser        = "${{ secrets.SQL_USERNAME }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $initialDb     = "master"
        $targetFolder     = "TimesheetDevTestMigration"
        $projectName      = "TimesheetMigration1"
        $executionJobName = "RunTimesheetDevTestMigrationPK"
        
        # STEP 3: CONVERT ISPAC FILE INTO BINARY DATA STREAM
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
        
        # STEP 4: INITIALIZE SQL SERVER DATABASE CONNECTION
        Write-Host "Establishing local tunnel connection..."
        
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=SSISDB;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        
        try {
            $connection.Open()
            # Using a single-quoted Here-String so PowerShell treats $ServerOption as pure literal text
            $sqlQuery = @'
            SET NOCOUNT ON;
            USE [msdb];
            
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'GitHub_SSIS_Deploy_Job')
            BEGIN
                EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job', @delete_unused_schedule=1;
            END
            
            EXEC dbo.sp_add_job @job_name = N'GitHub_SSIS_Deploy_Job', @enabled = 1, @start_step_id = 1;
            DECLARE @deploy_script NVARCHAR(MAX);
            SET @deploy_script = N'USE [SSISDB]; IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'') BEGIN EXEC [catalog].[create_folder] @folder_name = N''$targetFolder''; END DECLARE @project_stream VARBINARY(MAX) = $hexString; EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @project_stream = @project_stream;';
            EXEC dbo.sp_add_jobstep @job_name = N'GitHub_SSIS_Deploy_Job', @step_name = N'Run Deploy', @subsystem = N'TSQL', @command = @deploy_script, @retry_attempts = 0;
            EXEC dbo.sp_add_jobserver @job_name = N'GitHub_SSIS_Deploy_Job', @server_name = N'(local)';
            DECLARE @deploy_job_id UNIQUEIDENTIFIER;
            SELECT @deploy_job_id = job_id FROM msdb.dbo.sysjobs WHERE name = N'GitHub_SSIS_Deploy_Job';
            EXEC dbo.sp_start_job @job_name = N'GitHub_SSIS_Deploy_Job';
            -- Dynamic Polling Loop: Safely wait for deployment execution to complete
            WHILE EXISTS (
                SELECT 1 FROM msdb.dbo.sysjobactivity
                WHERE job_id = @deploy_job_id AND start_execution_date IS NOT NULL AND stop_execution_date IS NULL
            )
            BEGIN
                WAITFOR DELAY '00:00:02';
            END
            -- EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job';
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')
            BEGIN
                EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;
            END
            
            EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for $projectName.', @start_step_id = 1;
            DECLARE @TargetServer NVARCHAR(128) = CAST(SERVERPROPERTY('ServerName') AS NVARCHAR(128));
            DECLARE @run_command NVARCHAR(MAX);
            SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$projectName\TimesheetMigration.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @TargetServer + CHAR(34) + N' /Par ' + CHAR(34) + N'$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';
            EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;
            EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';
            EXEC dbo.sp_add_jobschedule
                @job_name = N'$executionJobName',
                @name = N'Every_1_Minute_8AM_to_5PM',
                @enabled = 1,
                @freq_type = 4,
                @freq_interval = 1,
                @freq_subday_type = 4,
                @freq_subday_interval = 1,
                @active_start_time = 080000,
                @active_end_time = 170000;
            
            EXEC dbo.sp_start_job @job_name = N'$executionJobName';
            WAITFOR DELAY '00:00:05';
        '@
            # Safe string replacements handled strictly at execution runtime
            $sqlQuery = $sqlQuery.Replace('$targetFolder', $targetFolder)
            $sqlQuery = $sqlQuery.Replace('$projectName', $projectName)
            $sqlQuery = $sqlQuery.Replace('$executionJobName', $executionJobName)
            $sqlQuery = $sqlQuery.Replace('$hexString', $hexString)
            
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            
            Write-Host "SUCCESS: Local SSIS Project deployed, job triggered, and execution delay finalized!"
            
        } catch {
            Write-Error "Local Deployment Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }

  # =========================================================================
  # JOB 2: CREATE DATABASE AND DEPLOY TO PARTNER SERVER
  # =========================================================================
  # JOB 2: DEPLOY TO PARTNER SERVER
  # =========================================================================
  deploy-partner:
    name: Production/Deploy
    runs-on: windows-latest
    needs: deploy-local
    environment: partner-sql
 
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
 
    - name: Deploy SSIS and Create Execution Job (Partner)
      shell: powershell
      run: |
 
        # STEP 1: LOCATE THE SSIS DEPLOYMENT FILE
        $ispacPath = "${{ github.workspace }}\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"
 
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing alternate path..."
            $ispacPath = "${{ github.workspace }}\..\Projects\TimesheetMigration1\TimesheetMigration1\bin\Development\TimesheetMigration1.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
 
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetMigration1.ispac file."
            exit 1
        }
 
        # STEP 2: DEFINE TARGET CONFIGURATIONS FROM YOUR ENVIRONMENT
        $tunnelAddress = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
        $dbUser        = "${{ secrets.SQL_USERNAME }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $initialDb     = "master"
 
        $targetFolder     = "TimesheetProductionMigration"
        $projectName      = "TimesheetMigration1"
        $executionJobName = "RunTimesheetProductionMigrationPK"
        # Target desktop server instance override
        $partnerServer    = "DESKTOP-DBA1BPB\SQLSERVER2025"
 
        # STEP 3: CONVERT ISPAC FILE INTO BINARY DATA STREAM
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
 
        # STEP 4: INITIALIZE SQL SERVER DATABASE CONNECTION VIA TUNNEL
        Write-Host "Establishing tunnel connection to partner environment..."
 
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
 
        try {
            $connection.Open()
 
            # Using a single-quoted Here-String so PowerShell treats $ServerOption as pure literal text
            $sqlQuery = @'
            SET NOCOUNT ON;
            USE [msdb];
 
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'GitHub_SSIS_Deploy_Job1')
            BEGIN
                EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job1', @delete_unused_schedule=1;
            END
 
            EXEC dbo.sp_add_job @job_name = N'GitHub_SSIS_Deploy_Job1', @enabled = 1, @start_step_id = 1;
 
            DECLARE @deploy_script NVARCHAR(MAX);
            SET @deploy_script = N'USE [SSISDB];
            IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'')
            BEGIN
                EXEC [catalog].[create_folder] @folder_name = N''$targetFolder'';
            END
            DECLARE @project_stream VARBINARY(MAX) = $hexString;
            EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @project_stream = @project_stream;
 
            -- Environment parameter overrides targeting DESKTOP-DBA1BPB\SQLSERVER2025 for both connection manager naming variations
            EXEC SSISDB.catalog.set_object_parameter_value @object_type = 20, @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @parameter_name = N''CM.TimesheetJPDB.ServerName'', @parameter_value = N''$partnerServer'';
            EXEC SSISDB.catalog.set_object_parameter_value @object_type = 20, @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @parameter_name = N''CM.LocalHost.TimesheetJPDB.ServerName'', @parameter_value = N''$partnerServer'';
            EXEC SSISDB.catalog.set_object_parameter_value @object_type = 20, @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @parameter_name = N''CM.TimesheetJPDB.InitialCatalog'', @parameter_value = N''TimesheetJPDB'';
            EXEC SSISDB.catalog.set_object_parameter_value @object_type = 20, @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @parameter_name = N''CM.LocalHost.TimesheetJPDB.InitialCatalog'', @parameter_value = N''TimesheetJPDB'';';
 
            EXEC dbo.sp_add_jobstep @job_name = N'GitHub_SSIS_Deploy_Job1', @step_name = N'Run Deploy', @subsystem = N'TSQL', @command = @deploy_script, @retry_attempts = 0;
            EXEC dbo.sp_add_jobserver @job_name = N'GitHub_SSIS_Deploy_Job1', @server_name = N'(local)';
            DECLARE @deploy_job_id UNIQUEIDENTIFIER;
            SELECT @deploy_job_id = job_id FROM msdb.dbo.sysjobs WHERE name = N'GitHub_SSIS_Deploy_Job1';
            EXEC dbo.sp_start_job @job_name = N'GitHub_SSIS_Deploy_Job1';
 
            # Dynamic Polling Loop: Safely wait for deployment execution to complete
            WHILE EXISTS (
                SELECT 1 FROM msdb.dbo.sysjobactivity
                WHERE job_id = @deploy_job_id AND start_execution_date IS NOT NULL AND stop_execution_date IS NULL
            )
            BEGIN
                WAITFOR DELAY '00:00:02';
            END
 
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')
            BEGIN
                EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;
            END
 
            EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for $projectName.', @start_step_id = 1;
 
            DECLARE @TargetServer NVARCHAR(128) = CAST(SERVERPROPERTY('ServerName') AS NVARCHAR(128));
            DECLARE @run_command NVARCHAR(MAX);
            SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$projectName\TimesheetMigration.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @TargetServer + CHAR(34) + N' /Par ' + CHAR(34) + N'$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';
 
            EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;
            EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';
            EXEC dbo.sp_add_jobschedule
                @job_name = N'$executionJobName',
                @name = N'Every_1_Minute_8AM_to_5PM',
                @enabled = 1,
                @freq_type = 4,
                @freq_interval = 1,
                @freq_subday_type = 4,
                @freq_subday_interval = 1,
                @active_start_time = 080000,
                @active_end_time = 170000;
 
            EXEC dbo.sp_start_job @job_name = N'$executionJobName';
            WAITFOR DELAY '00:00:05';
        '@
 
            # Safe string replacements handled strictly at execution runtime
            $sqlQuery = $sqlQuery.Replace('$targetFolder', $targetFolder)
            $sqlQuery = $sqlQuery.Replace('$projectName', $projectName)
            $sqlQuery = $sqlQuery.Replace('$executionJobName', $executionJobName)
            $sqlQuery = $sqlQuery.Replace('$partnerServer', $partnerServer)
            $sqlQuery = $sqlQuery.Replace('$hexString', $hexString)
 
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.CommandTimeout = 600
            $command.ExecuteNonQuery() | Out-Null
 
            Write-Host "SUCCESS: Partner deployment completed, configuration overrides applied, and task triggered!"
 
        } catch {
            Write-Error "Partner Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }