name: Pinggys SSIS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Stage: DevTest/Deploy
  # ==========================================
  DevTest_Deploy:
    name: DevTest/Deploy
    runs-on: windows-latest  # Changed to Windows for SSIS deployment
    environment: local-sql
    defaults:
      run:
        shell: pwsh
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SQL Server Tools
        run: |
          choco install sqlserver-cmdlineutils -y
          choco install sqlserver-management-studio -y
          Write-Host "✅ SQL Server tools installed"

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          Write-Host "Deploying TimesheetsDB to DevTest..."
          
          # Use -U/-P for database creation (SQL Auth works here)
          sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d master `
            -i "scripts/create_database.sql" `
            -b `
            -C
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Database deployment completed."
          } else {
            Write-Host "❌ Database deployment failed!"
            exit 1
          }

      # --- STEP 2: SSIS CATALOG ---
      - name: Initialize SSIS Catalog (SSISDB) if Missing
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          Write-Host "Checking if SSISDB exists..."
          
          $SSISDB_EXISTS = sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d master `
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" `
            -h-1 `
            -C
          
          $SSISDB_EXISTS = $SSISDB_EXISTS.Trim()
          
          if ($SSISDB_EXISTS -eq "0") {
            Write-Host "Creating SSISDB..."
            sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
              -U "$env:USERNAME" `
              -P "$env:PASSWORD" `
              -d master `
              -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '$env:PASSWORD';" `
              -C
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ SSISDB created successfully."
            } else {
              Write-Host "❌ Failed to create SSISDB."
              exit 1
            }
          } else {
            Write-Host "✅ SSISDB already exists."
          }

      # --- STEP 3: CREATE SSIS FOLDER ---
      - name: Create SSIS Folder
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $FOLDER_NAME = "TimesheetDevTestMigration"
          Write-Host "Verifying SSIS folder: $FOLDER_NAME"
          
          $FOLDER_EXISTS = sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d SSISDB `
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name='$FOLDER_NAME'" `
            -h-1 `
            -C
          
          $FOLDER_EXISTS = $FOLDER_EXISTS.Trim()
          
          if ($FOLDER_EXISTS -eq "0") {
            Write-Host "Folder '$FOLDER_NAME' not found. Creating..."
            sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
              -U "$env:USERNAME" `
              -P "$env:PASSWORD" `
              -d SSISDB `
              -Q "EXEC [SSISDB].[catalog].[create_folder] @folder_name=N'$FOLDER_NAME', @folder_id=0;" `
              -C
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Folder '$FOLDER_NAME' created successfully."
            } else {
              Write-Host "❌ Failed to create folder."
              exit 1
            }
          } else {
            Write-Host "✅ Folder '$FOLDER_NAME' already exists."
          }

      # --- STEP 4: DELETE EXISTING PROJECT (FOR CLEAN DEPLOYMENT) ---
      - name: Delete Existing Project (if exists)
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        continue-on-error: true
        run: |
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          
          Write-Host "Checking if project '$PROJECT_NAME' exists..."
          
          $PROJECT_EXISTS = sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d SSISDB `
            -Q "SET NOCOUNT ON; 
                SELECT COUNT(*) 
                FROM [SSISDB].[catalog].[projects] p
                INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                WHERE f.name = '$FOLDER_NAME' 
                  AND p.name = '$PROJECT_NAME'" `
            -h-1 `
            -C
          
          $PROJECT_EXISTS = $PROJECT_EXISTS.Trim()
          
          if ($PROJECT_EXISTS -eq "1") {
            Write-Host "⚠️  Project exists. Deleting for clean deployment..."
            
            sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
              -U "$env:USERNAME" `
              -P "$env:PASSWORD" `
              -d SSISDB `
              -Q "DECLARE @project_id bigint;
                  SELECT @project_id = p.project_id 
                  FROM [SSISDB].[catalog].[projects] p
                  INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                  WHERE f.name = '$FOLDER_NAME' AND p.name = '$PROJECT_NAME';
                  
                  IF @project_id IS NOT NULL
                  BEGIN
                    EXEC [SSISDB].[catalog].[delete_project] @project_id = @project_id;
                    PRINT '✅ Project deleted successfully.';
                  END
                  ELSE
                  BEGIN
                    PRINT '⚠️  Project not found.';
                  END" `
              -C
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Project deletion completed."
            }
          } else {
            Write-Host "✅ Project doesn't exist. Ready for fresh deployment."
          }

      # --- STEP 5: DEPLOY SSIS PACKAGE USING WINDOWS AUTHENTICATION ---
      - name: Deploy SSIS Package (.ispac) to DevTest
        id: deploy_ssis
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          # Using Windows Authentication - no USERNAME/PASSWORD needed
        run: |
          $PACKAGE_PATH = "ssis-packages/TimesheetMigration1.ispac"
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          
          Write-Host "Checking for package at: $PACKAGE_PATH"
          
          if (-not (Test-Path $PACKAGE_PATH)) {
            Write-Host "❌ Error: Package file $PACKAGE_PATH not found!"
            Write-Host "Current directory contents:"
            Get-ChildItem -Recurse | Select-Object FullName
            exit 1
          }
          
          Write-Host "Encoding package to Base64..."
          $bytes = [System.IO.File]::ReadAllBytes($PACKAGE_PATH)
          $PACKAGE_BASE64 = [Convert]::ToBase64String($bytes)
          
          Write-Host "Deploying Project to folder: $FOLDER_NAME"
          
          # Create deployment SQL
          $sql = @"
          SET QUOTED_IDENTIFIER ON;
          SET ANSI_NULLS ON;
          
          DECLARE @project_binary varbinary(max);
          DECLARE @base64 varchar(max) = '$PACKAGE_BASE64';
          
          SET @project_binary = CAST(N'' AS XML).value('xs:base64Binary(sql:variable("@base64"))', 'varbinary(max)');
          
          EXEC [SSISDB].[catalog].[deploy_project] 
            @folder_name = '$FOLDER_NAME',
            @project_name = '$PROJECT_NAME',
            @project_stream = @project_binary;
          "@
          
          $sql | Out-File -FilePath deploy.sql -Encoding ASCII
          
          # Use Windows Authentication (-E flag)
          Write-Host "Executing deployment with Windows Authentication..."
          sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -E `
            -d SSISDB `
            -i deploy.sql `
            -C
          
          $DEPLOY_EXIT_CODE = $LASTEXITCODE
          
          if ($DEPLOY_EXIT_CODE -eq 0) {
            Write-Host "✅ SSIS package deployed successfully!"
            Write-Host "DEPLOYMENT_STATUS=success" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "❌ SSIS deployment failed with exit code: $DEPLOY_EXIT_CODE"
            Write-Host "DEPLOYMENT_STATUS=failed" >> $env:GITHUB_OUTPUT
          }
          
          Remove-Item deploy.sql -ErrorAction SilentlyContinue

      # --- STEP 6: VERIFY DEPLOYMENT ---
      - name: Verify SSIS Deployment
        if: steps.deploy_ssis.outputs.DEPLOYMENT_STATUS == 'success'
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          # Using Windows Authentication
        run: |
          Write-Host "Verifying SSIS deployment..."
          
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          
          $PROJECT_EXISTS = sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -E `
            -d SSISDB `
            -Q "SET NOCOUNT ON; 
                SELECT COUNT(*) 
                FROM [SSISDB].[catalog].[projects] p
                INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                WHERE f.name = '$FOLDER_NAME' 
                  AND p.name = '$PROJECT_NAME'" `
            -h-1 `
            -C
          
          $PROJECT_EXISTS = $PROJECT_EXISTS.Trim()
          
          if ($PROJECT_EXISTS -eq "1") {
            Write-Host "✅ SSIS deployment verified successfully!"
            
            Write-Host ""
            Write-Host "📦 Packages in project:"
            sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
              -E `
              -d SSISDB `
              -Q "SET NOCOUNT ON; 
                  SELECT f.name as FolderName, p.name as ProjectName, pk.name as PackageName
                  FROM [SSISDB].[catalog].[packages] pk
                  INNER JOIN [SSISDB].[catalog].[projects] p ON pk.project_id = p.project_id
                  INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                  WHERE f.name = '$FOLDER_NAME' AND p.name = '$PROJECT_NAME'" `
              -C
          } else {
            Write-Host "❌ SSIS project not found in SSISDB."
            exit 1
          }

      # --- STEP 7: SSIS Deployment Failed Warning ---
      - name: SSIS Deployment Failed
        if: steps.deploy_ssis.outputs.DEPLOYMENT_STATUS != 'success'
        run: |
          Write-Host "⚠️  SSIS deployment failed!"
          Write-Host ""
          Write-Host "📋 Summary:"
          Write-Host "  ✅ Database: Created/Verified"
          Write-Host "  ✅ SSIS Catalog: Created/Verified"
          Write-Host "  ✅ SSIS Folder: Created/Verified"
          Write-Host "  ❌ SSIS Package: Deployment Failed"
          Write-Host ""
          Write-Host "🔧 Common issues:"
          Write-Host "  1. Windows Authentication not configured"
          Write-Host "  2. SQL Server not accessible"
          Write-Host "  3. SSISDB catalog not properly configured"
          Write-Host ""
          Write-Host "💡 To fix Windows Authentication issues:"
          Write-Host "  1. Ensure SQL Server is configured for Mixed Mode Authentication"
          Write-Host "  2. The GitHub Actions runner must be on the same domain"
          Write-Host "  3. Use a self-hosted runner with Windows Authentication"
          exit 1

      # --- STEP 8: CREATE JOB ---
      - name: Create DevTest SQL Agent Job
        if: always()
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          if (Test-Path "scripts/create_job.sql") {
            Write-Host "Creating SQL Agent Job..."
            sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
              -U "$env:USERNAME" `
              -P "$env:PASSWORD" `
              -d msdb `
              -i "scripts/create_job.sql" `
              -C
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Job created successfully."
            } else {
              Write-Host "⚠️  Job creation failed."
            }
          } else {
            Write-Host "⚠️  create_job.sql not found, skipping job creation."
          }

      # --- STEP 9: RUN THE JOB ---
      - name: Run DevTest Migration Job
        if: always()
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          Write-Host "Starting SQL Agent Job..."
          sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d msdb `
            -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" `
            -C -b 2>$null
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Job started successfully."
          } else {
            Write-Host "⚠️  Job may not exist or SQL Agent is not running"
          }

  # ==========================================
  # 2. Stage: Production/Deploy
  # ==========================================
  Production_Deploy:
    name: Production/Deploy
    runs-on: windows-latest
    needs: DevTest_Deploy
    environment: partner-sql
    if: success()
    defaults:
      run:
        shell: pwsh
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SQL Server Tools
        run: |
          choco install sqlserver-cmdlineutils -y
          choco install sqlserver-management-studio -y
          Write-Host "✅ SQL Server tools installed"

      # --- STEP 1: DEPLOY DATABASE ---
      - name: Deploy SQL Database Script (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          Write-Host "Deploying TimesheetsDB to Production (Partner)..."
          sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d master `
            -i "scripts/create_database.sql" `
            -b `
            -C
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Database deployment completed."
          }

      # --- STEP 2: SSIS CATALOG ---
      - name: Initialize SSIS Catalog (SSISDB) if Missing (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          $SSISDB_EXISTS = sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d master `
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='SSISDB'" `
            -h-1 `
            -C
          
          $SSISDB_EXISTS = $SSISDB_EXISTS.Trim()
          
          if ($SSISDB_EXISTS -eq "0") {
            Write-Host "Creating SSISDB (Partner)..."
            sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
              -U "$env:USERNAME" `
              -P "$env:PASSWORD" `
              -d master `
              -Q "EXEC [SSISDB].[catalog].[create_catalog] @password = '$env:PASSWORD';" `
              -C
          }

      # --- STEP 3: CREATE SSIS FOLDER ---
      - name: Create SSIS Folder (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $FOLDER_EXISTS = sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d SSISDB `
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [SSISDB].[catalog].[folders] WHERE name='$FOLDER_NAME'" `
            -h-1 `
            -C
          
          $FOLDER_EXISTS = $FOLDER_EXISTS.Trim()
          
          if ($FOLDER_EXISTS -eq "0") {
            Write-Host "Creating SSIS folder '$FOLDER_NAME' (Partner)..."
            sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
              -U "$env:USERNAME" `
              -P "$env:PASSWORD" `
              -d SSISDB `
              -Q "EXEC [SSISDB].[catalog].[create_folder] @folder_name=N'$FOLDER_NAME', @folder_id=0;" `
              -C
          } else {
            Write-Host "✅ Folder '$FOLDER_NAME' already exists (Partner)."
          }

      # --- STEP 4: DELETE EXISTING PROJECT ---
      - name: Delete Existing Project (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        continue-on-error: true
        run: |
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          
          $PROJECT_EXISTS = sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d SSISDB `
            -Q "SET NOCOUNT ON; 
                SELECT COUNT(*) 
                FROM [SSISDB].[catalog].[projects] p
                INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                WHERE f.name = '$FOLDER_NAME' 
                  AND p.name = '$PROJECT_NAME'" `
            -h-1 `
            -C
          
          $PROJECT_EXISTS = $PROJECT_EXISTS.Trim()
          
          if ($PROJECT_EXISTS -eq "1") {
            Write-Host "⚠️  Project exists. Deleting for clean deployment (Partner)..."
            sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
              -U "$env:USERNAME" `
              -P "$env:PASSWORD" `
              -d SSISDB `
              -Q "DECLARE @project_id bigint;
                  SELECT @project_id = p.project_id 
                  FROM [SSISDB].[catalog].[projects] p
                  INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                  WHERE f.name = '$FOLDER_NAME' AND p.name = '$PROJECT_NAME';
                  
                  IF @project_id IS NOT NULL
                  BEGIN
                    EXEC [SSISDB].[catalog].[delete_project] @project_id = @project_id;
                    PRINT '✅ Project deleted successfully.';
                  END" `
              -C
          } else {
            Write-Host "✅ Project doesn't exist. Ready for fresh deployment (Partner)."
          }

      # --- STEP 5: DEPLOY SSIS PACKAGE TO PARTNER ---
      - name: Deploy SSIS Package (.ispac) to Partner
        id: deploy_ssis_partner
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          # Using Windows Authentication
        run: |
          $PACKAGE_PATH = "ssis-packages/TimesheetMigration1.ispac"
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          
          if (-not (Test-Path $PACKAGE_PATH)) {
            Write-Host "❌ Error: Package file $PACKAGE_PATH not found!"
            exit 1
          }
          
          Write-Host "Encoding package to Base64..."
          $bytes = [System.IO.File]::ReadAllBytes($PACKAGE_PATH)
          $PACKAGE_BASE64 = [Convert]::ToBase64String($bytes)
          
          $sql = @"
          SET QUOTED_IDENTIFIER ON;
          SET ANSI_NULLS ON;
          
          DECLARE @project_binary varbinary(max);
          DECLARE @base64 varchar(max) = '$PACKAGE_BASE64';
          
          SET @project_binary = CAST(N'' AS XML).value('xs:base64Binary(sql:variable("@base64"))', 'varbinary(max)');
          
          EXEC [SSISDB].[catalog].[deploy_project] 
            @folder_name = '$FOLDER_NAME',
            @project_name = '$PROJECT_NAME',
            @project_stream = @project_binary;
          "@
          
          $sql | Out-File -FilePath deploy.sql -Encoding ASCII
          
          Write-Host "Deploying to Partner environment with Windows Authentication..."
          sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -E `
            -d SSISDB `
            -i deploy.sql `
            -C
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ SSIS package deployed successfully (Partner)!"
            Write-Host "DEPLOYMENT_STATUS=success" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "❌ SSIS deployment failed (Partner)."
            Write-Host "DEPLOYMENT_STATUS=failed" >> $env:GITHUB_OUTPUT
          }
          
          Remove-Item deploy.sql -ErrorAction SilentlyContinue

      # --- STEP 6: VERIFY DEPLOYMENT (Partner) ---
      - name: Verify SSIS Deployment (Partner)
        if: steps.deploy_ssis_partner.outputs.DEPLOYMENT_STATUS == 'success'
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
        run: |
          Write-Host "Verifying SSIS deployment (Partner)..."
          
          $FOLDER_NAME = "TimesheetDevTestMigration"
          $PROJECT_NAME = "TimesheetMigration1"
          
          $PROJECT_EXISTS = sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -E `
            -d SSISDB `
            -Q "SET NOCOUNT ON; 
                SELECT COUNT(*) 
                FROM [SSISDB].[catalog].[projects] p
                INNER JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
                WHERE f.name = '$FOLDER_NAME' 
                  AND p.name = '$PROJECT_NAME'" `
            -h-1 `
            -C
          
          $PROJECT_EXISTS = $PROJECT_EXISTS.Trim()
          
          if ($PROJECT_EXISTS -eq "1") {
            Write-Host "✅ SSIS deployment verified successfully (Partner)!"
          } else {
            Write-Host "❌ SSIS project not found in SSISDB (Partner)."
            exit 1
          }

      # --- STEP 7: CREATE JOB (Partner) ---
      - name: Create Partner SQL Agent Job
        if: always()
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          if (Test-Path "scripts/create_job.sql") {
            Write-Host "Creating SQL Agent Job (Partner)..."
            sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
              -U "$env:USERNAME" `
              -P "$env:PASSWORD" `
              -d msdb `
              -i "scripts/create_job.sql" `
              -C
          }

      # --- STEP 8: RUN JOB (Partner) ---
      - name: Run Partner Migration Job
        if: always()
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          PORT: ${{ secrets.PARTNER_SQL_PORT }}
          USERNAME: ${{ secrets.PARTNER_SQL_USERNAME }}
          PASSWORD: ${{ secrets.PARTNER_SQL_PASSWORD }}
        run: |
          Write-Host "Starting Partner SQL Agent Job..."
          sqlcmd -S "${env:SERVER},${env:PORT:-1433}" `
            -U "$env:USERNAME" `
            -P "$env:PASSWORD" `
            -d msdb `
            -Q "EXEC dbo.sp_start_job N'RunTimesheetDevTestMigrationPK';" `
            -C -b 2>$null