# .github/workflows/deploy-and-migrate.yml
name: Deploy Database and Run Migration

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:  # Allows manual triggering

env:
  SQL_SERVER: ${{ secrets.SQL_SERVER }}
  SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
  SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
  DATABASE_NAME: TimesheetsDB

jobs:
  deploy-and-migrate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install SQLCMD and Tools
      run: |
        # Install SQLCMD
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
        sudo apt-get update
        sudo apt-get install -y mssql-tools unixodbc-dev
        echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc
        source ~/.bashrc
    
    - name: Deploy Database Schema and Seed Data
      run: |
        echo "Creating database and tables..."
        /opt/mssql-tools/bin/sqlcmd -S $SQL_SERVER -U $SQL_USERNAME -P $SQL_PASSWORD -i scripts/create_database.sql -b
      env:
        SQL_SERVER: ${{ secrets.SQL_SERVER }}
        SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
        SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
    
    - name: Verify Database Creation
      run: |
        echo "Verifying database deployment..."
        /opt/mssql-tools/bin/sqlcmd -S $SQL_SERVER -U $SQL_USERNAME -P $SQL_PASSWORD -d TimesheetsDB -Q "
        SELECT 'Database: TimesheetsDB' as Status;
        SELECT COUNT(*) as EmployeeCount FROM timesheet.Employee;
        SELECT COUNT(*) as ClientCount FROM timesheet.Client;
        "
      env:
        SQL_SERVER: ${{ secrets.SQL_SERVER }}
        SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
        SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
    
    - name: Check if TimesheetMigration Job Exists
      id: check_job
      run: |
        JOB_EXISTS=$(/opt/mssql-tools/bin/sqlcmd -S $SQL_SERVER -U $SQL_USERNAME -P $SQL_PASSWORD -d msdb -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sysjobs WHERE name = 'TimesheetMigration'" -h-1)
        echo "Job exists: $JOB_EXISTS"
        echo "job_exists=$JOB_EXISTS" >> $GITHUB_OUTPUT
      env:
        SQL_SERVER: ${{ secrets.SQL_SERVER }}
        SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
        SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
    
    - name: Run TimesheetMigration Job
      if: steps.check_job.outputs.job_exists == '1'
      run: |
        echo "Starting TimesheetMigration job..."
        /opt/mssql-tools/bin/sqlcmd -S $SQL_SERVER -U $SQL_USERNAME -P $SQL_PASSWORD -d msdb -Q "EXEC dbo.sp_start_job N'TimesheetMigration';"
        echo "Job started successfully."
      env:
        SQL_SERVER: ${{ secrets.SQL_SERVER }}
        SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
        SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
    
    - name: Wait for Job to Complete and Check Status
      if: steps.check_job.outputs.job_exists == '1'
      run: |
        echo "Waiting for job to complete..."
        # Wait up to 60 seconds for job to start
        sleep 5
        
        # Check job status
        JOB_STATUS=$(/opt/mssql-tools/bin/sqlcmd -S $SQL_SERVER -U $SQL_USERNAME -P $SQL_PASSWORD -d msdb -Q "
        SET NOCOUNT ON;
        SELECT TOP 1 
            CASE 
                WHEN run_status = 0 THEN 'Failed'
                WHEN run_status = 1 THEN 'Succeeded'
                WHEN run_status = 2 THEN 'Retry'
                WHEN run_status = 3 THEN 'Canceled'
                ELSE 'Unknown'
            END as Status
        FROM sysjobhistory h
        JOIN sysjobs j ON h.job_id = j.job_id
        WHERE j.name = 'TimesheetMigration'
        ORDER BY h.instance_id DESC
        " -h-1)
        
        echo "Job Status: $JOB_STATUS"
        
        if [ "$JOB_STATUS" == "Failed" ] || [ "$JOB_STATUS" == "Canceled" ]; then
          echo "Job failed or was cancelled. Check SQL Server logs for details."
          exit 1
        elif [ "$JOB_STATUS" == "Succeeded" ]; then
          echo "Job completed successfully!"
        else
          echo "Job status: $JOB_STATUS. Please check manually if this is expected."
        fi
      env:
        SQL_SERVER: ${{ secrets.SQL_SERVER }}
        SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
        SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
    
    - name: Final Verification
      run: |
        echo "Final database verification..."
        /opt/mssql-tools/bin/sqlcmd -S $SQL_SERVER -U $SQL_USERNAME -P $SQL_PASSWORD -d TimesheetsDB -Q "
        SELECT 'Migration completed successfully!' as Status;
        SELECT GETDATE() as CompletionTime;
        "
      env:
        SQL_SERVER: ${{ secrets.SQL_SERVER }}
        SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
        SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}