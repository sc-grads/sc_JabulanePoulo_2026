# Name of the workflow
name: Deployment

# Trigger the workflow on push events to the main branch
on:
  push:
    branches:
      - main      # Triggers workflow when code is pushed to main branch
      - dev       # Triggers workflow when code is pushed to dev branch

# Environment variables available to all jobs in the workflow
env:
  MONGODB_DB_NAME: gha-demo    # Name of the MongoDB database to use

# Define the jobs that will run as part of the workflow
jobs:
  # First job: Run tests and linting
  test:
    # Environment variables specific to the test job
    env:
      MONGODB_CLUSTER_ADDRESS: cluster0.baiayyr.mongodb.net  # MongoDB cluster address
      MONGODB_USERNAME: jabulanepoulo_db_user                # Database username
      MONGODB_PASSWORD: cHiPyBsfju3WCnhK                     # Database password (Note: In production, use secrets!)
    
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner for this job
    
    steps:
      # Step 1: Checkout the repository code
      - name: Get Code
        uses: actions/checkout@v3    # GitHub's official checkout action to fetch code
      
      # Step 2: Cache npm dependencies for faster subsequent runs
      - name: Cache dependencies
        uses: actions/cache@v3        # GitHub's caching action
        with:
          path: ~/.npm               # Cache location for npm packages
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}  # Unique cache key based on package-lock
      
      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci                  # 'ci' is faster and stricter than 'npm install' for CI environments
      
      # Step 4: Start the application server
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:XYZ  # Starts server in background and waits for it to be ready
        # Note: 'XYZ' should be replaced with the actual port number your app runs on
      
      # Step 5: Run the test suite against the running server
      - name: Run tests
        run: npm test                # Executes test scripts defined in package.json
      
      # Step 6: Output confirmation message
      - name: Output information
        run: echo "..."              # Placeholder for test completion message
  
  # Second job: Deploy the application (only runs if tests pass)
  deploy:
    needs: test                     # This job waits for the 'test' job to complete successfully
    runs-on: ubuntu-latest          # Use the latest Ubuntu runner
    
    steps:
      # Output deployment information
      - name: Output information
        run: |        
          echo "..."                # Placeholder for deployment steps (e.g., deploy to cloud platform)
        # Common deployment steps would go here, such as:
        # - Deploy to AWS, Azure, GCP, Heroku, etc.
        # - Upload artifacts to a server
        # - Update container registries
        # - Trigger deployment scripts